<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>emy</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      background: #fff;
      color: #111;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;
      line-height: 1.35;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    /* HEADER */

    header {
      position: sticky;
      top: 0;

      z-index: 100;

      background: rgba(
        255,
        255,
        255,
        0.96
      );

      border-bottom:
        1px solid #ddd;
    }


    .top {
      display: none;
    }


    .status {
      color: #999;
      font-size: 11px;
    }


    /* CHANNEL NAV */

    nav {

      display: flex;

      gap: 16px;

      padding:
        12px 16px;

      overflow-x: auto;

      white-space: nowrap;

      scrollbar-width: none;
    }


    nav::-webkit-scrollbar {
      display: none;
    }


    nav button {

      border: 0;

      padding: 0;
      margin: 0;

      background: transparent;

      color: #999;

      font-family: inherit;

      font-size: 13px;

      cursor: pointer;
    }


    nav button:hover,
    nav button.active {

      color: #111;

    }


    /* MAIN */

    main {

      padding:
        18px 16px 60px;

    }


    .channel-title {

      margin:
        0 0 20px;

      font-size: 13px;

      font-weight: normal;

    }


    /* GRID */

    .grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0, 1fr)
        );

      gap:
        20px 16px;

      align-items: start;

    }


    /* BLOCK */

    .block {

      min-width: 0;

    }


    .block img {

      display: block;

      width: 100%;

      height: auto;

      background: #f5f5f5;

    }
.block video {
  display: block;
  width: 100%;
  height: auto;
  background: #f5f5f5;
  object-fit: cover;
}

.video-link {
  display: block;
  cursor: pointer;
}


    /* CAPTION */

    .caption {

      margin-top: 6px;

      color: #777;

      font-size: 11px;

    }


    /* TEXT */

    .text-block {

      padding: 12px;

      background: #f4f4f4;

      white-space: pre-wrap;

    }


    /* LINKS */

    .link-block {

      display: block;

      border-top:
        1px solid #ccc;

      padding-top: 7px;

    }


    .link-block img {

      margin-bottom: 7px;

    }


    .link-title {

      font-size: 13px;

    }


    .link-url {

      margin-top: 3px;

      color: #999;

      font-size: 11px;

      word-break: break-word;

    }


    /* MESSAGES */

    .message {

      padding: 40px 0;

      color: #999;

    }


    .load-more {

      display: block;

      margin:
        45px auto 0;

      border: 0;

      background: transparent;

      color: #888;

      font-family: inherit;

      font-size: 12px;

      cursor: pointer;

    }


    .load-more:hover {

      color: #111;

    }


    /* MOBILE */

    @media (
      max-width: 800px
    ) {

      .grid {

        grid-template-columns:
          repeat(
            3,
            minmax(0, 1fr)
          );

      }

    }


    @media (
      max-width: 550px
    ) {

      body {
        font-size: 12px;
      }


      .top {

        padding:
          10px 12px 7px;

      }


      nav {

        padding-left: 12px;
        padding-right: 12px;

        padding-bottom: 10px;

        gap: 13px;

      }


      nav button {
        font-size: 12px;
      }


      main {

        padding:
          14px 12px 50px;

      }


      .grid {

        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );

        gap:
          16px 10px;

      }

    }

  </style>

</head>


<body>


<header>

  <div class="top">

    <div
      class="status"
      id="status"
    ></div>

  </div>


  <nav id="nav"></nav>

</header>


<main>

  <h1
    class="channel-title"
    id="title"
  >
    all
  </h1>


  <div
    class="grid"
    id="grid"
  >

    <div class="message">
      loading…
    </div>

  </div>


  <button
    class="load-more"
    id="loadMore"
    style="display:none"
  >
    load more
  </button>

</main>


<script>


/* ==================================================
   SETTINGS
================================================== */


const USER =
  "emy-fuplg6fvywk";


const API =
  "https://api.are.na/v3";


/*
 * Are.na allows up to 100 items per page.
 */

const PER_PAGE = 100;


/*
 * Automatically refresh the currently
 * displayed content every 5 minutes.
 *
 * This matches the caching behaviour of
 * unauthenticated Are.na API responses.
 */

const REFRESH_INTERVAL =
  5 * 60 * 1000;


/* ==================================================
   STATE
================================================== */


let channels = [];

let currentChannel = null;

let currentPage = 1;

let hasMore = false;

let loading = false;

let refreshTimer = null;


/*
 * Prevent old API responses from rendering
 * after the user has clicked another channel.
 */

let viewRequestId = 0;


/* ==================================================
   API REQUEST
================================================== */


async function request(url) {

  const response =
    await fetch(url, {
      cache: "no-cache"
    });


  if (!response.ok) {

    throw new Error(
      "API error " +
      response.status
    );

  }


  return response.json();

}


/* ==================================================
   LOAD YOUR CREATED CHANNELS
================================================== */


async function loadChannels() {

  try {

    setStatus("loading…");


    /*
     * Get all content created by you,
     * then keep only Channel objects.
     *
     * We paginate this because Are.na's
     * user-content endpoint is paginated.
     */

    let page = 1;

    let everything = [];


    while (true) {

      const result =
        await request(
          `${API}/users/${USER}/contents?page=${page}&per=${PER_PAGE}`
        );


      if (result.data) {

        everything.push(
          ...result.data
        );

      }


      if (
        !result.meta ||
        !result.meta.has_more_pages
      ) {

        break;

      }


      page++;

    }


    /*
     * Keep only channels.
     */

    channels =
      everything.filter(
        item =>
          item.type === "Channel"
      );


    /*
     * Remove duplicate channels.
     */

    const ids =
      new Set();


    channels =
      channels.filter(
        channel => {

          if (
            ids.has(channel.id)
          ) {

            return false;

          }


          ids.add(channel.id);

          return true;

        }
      );


    /*
     * Alphabetical navigation.
     */

    channels.sort(
      (a, b) =>
        a.title.localeCompare(
          b.title
        )
    );


    buildNav();


    setStatus("");


    /*
     * Start with ALL.
     */

    await showAll();


    /*
     * Start automatic syncing.
     */

    startAutoRefresh();


  } catch (error) {

    console.error(
      "CHANNEL LIST ERROR:",
      error
    );


    setStatus("");


    showError(
      "Couldn't load your channels."
    );

  }

}


/* ==================================================
   BUILD NAVIGATION
================================================== */


function buildNav() {

  const nav =
    document.getElementById(
      "nav"
    );


  nav.innerHTML = "";


  /*
   * ALL
   */

  const all =
    document.createElement(
      "button"
    );


  all.textContent =
    "all";


  all.dataset.id =
    "all";


  all.classList.add(
    "active"
  );


  all.onclick =
    showAll;


  nav.appendChild(
    all
  );


  /*
   * CHANNELS
   */

  channels.forEach(
    channel => {

      const button =
        document.createElement(
          "button"
        );


      button.textContent =
        channel.title;


      button.dataset.id =
        channel.id;


      button.onclick =
        () =>
          showChannel(
            channel
          );


      nav.appendChild(
        button
      );

    }
  );

}


/* ==================================================
   ACTIVE NAVIGATION
================================================== */


function setActive(id) {

  document
    .querySelectorAll(
      "#nav button"
    )
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );


        if (
          String(
            button.dataset.id
          )
          ===
          String(id)
        ) {

          button.classList.add(
            "active"
          );

        }

      }
    );

}


/* ==================================================
   FETCH ONE CHANNEL — ALL PAGES
================================================== */


async function fetchAllChannelBlocks(
  channel
) {

  let page = 1;

  let blocks = [];


  while (true) {

    const result =
      await request(
        `${API}/channels/${channel.id}/contents?page=${page}&per=${PER_PAGE}`
      );


    if (result.data) {

      blocks.push(
        ...result.data
      );

    }


    /*
     * Stop when there are no more pages.
     */

    if (
      !result.meta ||
      !result.meta.has_more_pages
    ) {

      break;

    }


    page++;

  }


  return blocks;

}


/* ==================================================
   SHOW ALL
================================================== */


async function showAll(
  preserveScroll = false
) {

  const requestId =
    ++viewRequestId;


  currentChannel =
    null;


  currentPage =
    1;


  hasMore =
    false;


  setActive("all");


  if (!preserveScroll) {

    reset();

  }


  document.getElementById(
    "title"
  ).textContent =
    "all";


  showLoading();


  try {

    /*
     * Fetch every page from every channel.
     *
     * Promise.all means the channels are
     * fetched in parallel rather than one
     * after another.
     */

    const results =
      await Promise.all(

        channels.map(
          async channel => {

            const blocks =
              await fetchAllChannelBlocks(
                channel
              );


            return {
              channel,
              blocks
            };

          }
        )

      );


    /*
     * If the user clicked another channel
     * while this request was running,
     * don't overwrite that newer view.
     */

    if (
      requestId !== viewRequestId
    ) {

      return;

    }


    let blocks = [];


    /*
     * Combine all channel contents.
     */

    results.forEach(
      result => {

        result.blocks.forEach(
          block => {

            /*
             * Don't render nested channels.
             */

            if (
              block.type === "Channel"
            ) {

              return;

            }


            blocks.push({

              ...block,

              sourceChannel:
                result.channel.title

            });

          }
        );

      }
    );


    /*
     * Remove duplicate blocks.
     *
     * The same Are.na block can be connected
     * to several channels.
     */

    const seen =
      new Set();


    blocks =
      blocks.filter(
        block => {

          if (
            seen.has(block.id)
          ) {

            return false;

          }


          seen.add(
            block.id
          );


          return true;

        }
      );


    /*
     * Sort newest first.
     *
     * Prefer created_at because "all"
     * represents your additions.
     */

    blocks.sort(
      (a, b) => {

        const dateA =
          new Date(
            a.created_at || 0
          ).getTime();


        const dateB =
          new Date(
            b.created_at || 0
          ).getTime();


        return dateB - dateA;

      }
    );


    clearLoading();


    render(
      blocks,
      true
    );


    updateLoadMore();


  } catch (error) {

    console.error(
      "ALL ERROR:",
      error
    );


    if (
      requestId !== viewRequestId
    ) {

      return;

    }


    showError(
      "Couldn't load your content."
    );

  }

}


/* ==================================================
   SHOW CHANNEL
================================================== */


async function showChannel(
  channel
) {

  const requestId =
    ++viewRequestId;


  currentChannel =
    channel;


  currentPage =
    1;


  hasMore =
    false;


  setActive(
    channel.id
  );


  reset();


  document.getElementById(
    "title"
  ).textContent =
    channel.title;


  showLoading();


  try {

    await loadChannelPage(
      channel,
      1,
      true,
      requestId
    );


    if (
      requestId !== viewRequestId
    ) {

      return;

    }


    window.scrollTo(
      {
        top: 0,
        behavior: "smooth"
      }
    );


  } catch (error) {

    console.error(
      "CHANNEL ERROR:",
      error
    );


    if (
      requestId !== viewRequestId
    ) {

      return;

    }


    showError(
      "Couldn't load this channel."
    );

  }

}


/* ==================================================
   LOAD CHANNEL CONTENT
================================================== */


async function loadChannelPage(
  channel,
  page,
  replace,
  requestId
) {

  if (loading) {

    return;

  }


  loading =
    true;


  try {

    const url =
      `${API}/channels/${channel.id}/contents?page=${page}&per=${PER_PAGE}`;


    console.log(
      "Loading:",
      url
    );


    const result =
      await request(url);


    /*
     * Don't render stale responses.
     */

    if (
      requestId !== viewRequestId
    ) {

      return;

    }


    const blocks =
      result.data || [];


    if (replace) {

      clearLoading();

    }


    render(
      blocks,
      replace
    );


    hasMore =
      result.meta?.has_more_pages
      || false;


    currentPage =
      result.meta?.current_page
      || page;


    updateLoadMore();


  } finally {

    loading =
      false;

  }

}


/* ==================================================
   LOAD MORE
================================================== */


document
  .getElementById(
    "loadMore"
  )
  .onclick =
  async function() {

    if (
      !currentChannel ||
      !hasMore ||
      loading
    ) {

      return;

    }


    this.textContent =
      "loading…";


    await loadChannelPage(
      currentChannel,
      currentPage + 1,
      false,
      viewRequestId
    );


    if (hasMore) {

      this.textContent =
        "load more";

    }

    else {

      this.textContent =
        "load more";

    }

  };


/* ==================================================
   RENDER
================================================== */


function render(
  blocks,
  replace = false
) {

  const grid =
    document.getElementById(
      "grid"
    );


  if (replace) {

    grid.innerHTML =
      "";

  }


  blocks.forEach(
    block => {

      const element =
        createBlock(
          block
        );


      if (element) {

        grid.appendChild(
          element
        );

      }

    }
  );


  if (
    replace &&
    !blocks.length
  ) {

    grid.innerHTML =
      `<div class="message">
        This channel is empty.
      </div>`;

  }

}


/* ==================================================
   CREATE BLOCK
================================================== */
function createBlock(block) {

  console.log("ARE.NA BLOCK:", block);

  const wrapper =
    document.createElement(
      "div"
    );


function createBlock(
  block
) {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "block";


  /* -----------------------------------------------
     IMAGE
  ------------------------------------------------ */

  if (
    block.type ===
    "Image"
  ) {

    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (!imageUrl) {

      console.warn(
        "Image without URL:",
        block
      );


      return null;

    }


    const link =
      document.createElement(
        "a"
      );


    link.href =
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const image =
      document.createElement(
        "img"
      );


    image.src =
      imageUrl;


    image.alt =
      block.title ||
      block.image?.alt_text ||
      "";


    image.loading =
      "lazy";


    image.decoding =
      "async";


    image.onerror =
      function() {

        console.warn(
          "Image failed:",
          imageUrl
        );


        wrapper.remove();

      };


    link.appendChild(
      image
    );


    wrapper.appendChild(
      link
    );


    if (block.title) {

      const caption =
        document.createElement(
          "div"
        );


      caption.className =
        "caption";


      caption.textContent =
        block.title;


      wrapper.appendChild(
        caption
      );

    }


    return wrapper;

  }


  /* -----------------------------------------------
     TEXT
  ------------------------------------------------ */

  if (
    block.type ===
    "Text"
  ) {

    const text =
      document.createElement(
        "div"
      );


    text.className =
      "text-block";


    text.textContent =
      block.content?.plain ||
      "";


    wrapper.appendChild(
      text
    );


    return wrapper;

  }


  /* -----------------------------------------------
     LINK
  ------------------------------------------------ */

  if (
    block.type ===
    "Link"
  ) {

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "link-block";


    link.href =
      block.url ||
      block.source?.url ||
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (imageUrl) {

      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageUrl;


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.onerror =
        function() {

          image.style.display =
            "none";

        };


      link.appendChild(
        image
      );

    }


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "link-title";


    title.textContent =
      block.title ||
      block.source?.title ||
      "link";


    link.appendChild(
      title
    );


    const url =
      document.createElement(
        "div"
      );


    url.className =
      "link-url";


    url.textContent =
      block.url ||
      block.source?.url ||
      "";


    link.appendChild(
      url
    );


    wrapper.appendChild(
      link
    );


    return wrapper;

  }


 /* -----------------------------------------------
   ATTACHMENT / VIDEO
------------------------------------------------ */

if (
  block.type ===
  "Attachment"
) {

  /*
   * Are.na attachments can contain videos.
   *
   * Try to find the actual file URL from the
   * attachment object.
   */

  const attachmentUrl =
    block.attachment?.url ||
    block.url ||
    block.attachment?.file_url;


  /*
   * Detect common video formats.
   */

  const isVideo =
    attachmentUrl &&
    /\.(mp4|webm|mov|m4v|ogv)(\?.*)?$/i.test(
      attachmentUrl
    );


  /* -----------------------------------------------
     VIDEO
  ------------------------------------------------ */

  if (isVideo) {

    /*
     * Clicking the video goes to the original
     * Are.na block rather than the video file.
     */

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "video-link";


    link.href =
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const video =
      document.createElement(
        "video"
      );


    video.src =
      attachmentUrl;


    /*
     * Autoplay requirements:
     *
     * muted  = browsers allow autoplay
     * loop   = video repeats forever
     * playsinline = prevents fullscreen takeover
     * autoplay = starts automatically
     */

    video.autoplay =
      true;


    video.muted =
      true;


    video.loop =
      true;


    video.playsInline =
      true;


    video.setAttribute(
      "autoplay",
      ""
    );


    video.setAttribute(
      "muted",
      ""
    );


    video.setAttribute(
      "loop",
      ""
    );


    video.setAttribute(
      "playsinline",
      ""
    );


    /*
     * Don't show browser video controls.
     * The video itself is the visual object.
     */

    video.controls =
      false;


    /*
     * If autoplay is blocked for any reason,
     * try starting playback once the element
     * has been added to the page.
     */

    video.addEventListener(
      "canplay",
      function() {

        video.play().catch(
          function(error) {

            console.log(
              "Autoplay prevented:",
              error
            );

          }
        );

      }
    );


    link.appendChild(
      video
    );


    wrapper.appendChild(
      link
    );


    /*
     * Optional title/caption.
     */

    if (block.title) {

      const caption =
        document.createElement(
          "div"
        );


      caption.className =
        "caption";


      caption.textContent =
        block.title;


      wrapper.appendChild(
        caption
      );

    }


    return wrapper;

  }


  /* -----------------------------------------------
     NORMAL ATTACHMENT
  ------------------------------------------------ */

  const link =
    document.createElement(
      "a"
    );


  link.className =
    "link-block";


  link.href =
    block.url ||
    `https://www.are.na/block/${block.id}`;


  link.target =
    "_blank";


  link.rel =
    "noopener noreferrer";


  const imageUrl =
    block.image?.large?.src ||
    block.image?.medium?.src ||
    block.image?.small?.src ||
    block.image?.src;


  if (imageUrl) {

    const image =
      document.createElement(
        "img"
      );


    image.src =
      imageUrl;


    image.loading =
      "lazy";


    image.decoding =
      "async";


    image.onerror =
      function() {

        image.style.display =
          "none";

      };


    link.appendChild(
      image
    );

  }


  const title =
    document.createElement(
      "div"
    );


  title.className =
    "link-title";


  title.textContent =
    block.title ||
    block.filename ||
    "attachment";


  link.appendChild(
    title
  );


  wrapper.appendChild(
    link
  );


  return wrapper;

}

      );

    link.href =
      block.url ||
      `https://www.are.na/block/${block.id}`;


    link.target =

    link.rel =
      "noopener noreferrer";


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (imageUrl) {

      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageUrl;


      image.loading =
        "lazy";


      image.decoding =
        "async";


      link.appendChild(
        image
      );

    }


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "link-title";


    title.textContent =
      block.title ||
      block.filename ||
      "attachment";


    link.appendChild(
      title
    );


    wrapper.appendChild(
      link
    );


    return wrapper;

  }


  /* -----------------------------------------------
     EMBED
  ------------------------------------------------ */

  if (
    block.type ===
    "Embed"
  ) {

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "link-block";


    link.href =
      block.embed?.source_url ||
      block.source?.url ||
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (imageUrl) {

      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageUrl;


      image.loading =
        "lazy";


      image.decoding =
        "async";


      link.appendChild(
        image
      );

    }


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "link-title";


    title.textContent =
      block.title ||
      "embed";


    link.appendChild(
      title
    );


    wrapper.appendChild(
      link
    );


    return wrapper;

  }


  return null;

}


/* ==================================================
   RESET
================================================== */


function reset() {

  document.getElementById(
    "grid"
  ).innerHTML =
    "";


  document.getElementById(
    "loadMore"
  ).style.display =
    "none";


  currentPage =
    1;


  hasMore =
    false;

}


/* ==================================================
   LOADING
================================================== */


function showLoading() {

  document.getElementById(
    "grid"
  ).innerHTML =
    `<div class="message">
      loading…
    </div>`;

}


function clearLoading() {

  const messages =
    document.querySelectorAll(
      ".message"
    );


  messages.forEach(
    message => {

      message.remove();

    }
  );

}


/* ==================================================
   ERROR
================================================== */


function showError(
  message
) {

  document.getElementById(
    "grid"
  ).innerHTML =
    `<div class="message">
      ${message}
    </div>`;

}


/* ==================================================
   LOAD MORE UI
================================================== */


function updateLoadMore() {

  const button =
    document.getElementById(
      "loadMore"
    );


  if (
    currentChannel &&
    hasMore
  ) {

    button.style.display =
      "block";

  }

  else {

    button.style.display =
      "none";

  }

}


/* ==================================================
   STATUS
================================================== */


function setStatus(
  text
) {

  document.getElementById(
    "status"
  ).textContent =
    text;

}


/* ==================================================
   AUTOMATIC REFRESH
================================================== */


function startAutoRefresh() {

  /*
   * Don't create multiple timers.
   */

  if (refreshTimer) {

    clearInterval(
      refreshTimer
    );

  }


  refreshTimer =
    setInterval(
      async function() {

        /*
         * Only refresh if the page is
         * currently visible.
         *
         * This avoids unnecessary API
         * requests when the browser tab
         * is in the background.
         */

        if (
          document.visibilityState !==
          "visible"
        ) {

          return;

        }


        console.log(
          "Automatic Are.na refresh…"
        );


        if (
          currentChannel
        ) {

          /*
           * Refresh the current channel.
           */

          await refreshCurrentChannel();

        }

        else {

          /*
           * Refresh ALL.
           */

          await showAll(true);

        }

      },
      REFRESH_INTERVAL
    );

}


/* ==================================================
   REFRESH CURRENT CHANNEL
================================================== */


async function refreshCurrentChannel() {

  if (
    !currentChannel ||
    loading
  ) {

    return;

  }


  const requestId =
    ++viewRequestId;


  try {

    /*
     * Refresh from page 1.
     *
     * We deliberately don't clear the
     * existing grid until the new data
     * has successfully arrived.
     */

    const result =
      await request(
        `${API}/channels/${currentChannel.id}/contents?page=1&per=${PER_PAGE}`
      );


    if (
      requestId !== viewRequestId
    ) {

      return;

    }


    const blocks =
      result.data || [];


    const grid =
      document.getElementById(
        "grid"
      );


    grid.innerHTML =
      "";


    render(
      blocks,
      true
    );


    hasMore =
      result.meta?.has_more_pages
      || false;


    currentPage =
      result.meta?.current_page
      || 1;


    updateLoadMore();


  } catch (error) {

    console.error(
      "AUTO REFRESH ERROR:",
      error
    );

  }

}


/* ==================================================
   START
================================================== */


loadChannels();


</script>
