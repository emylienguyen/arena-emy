<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>emy</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;
      line-height: 1.35;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* ==================================================
       HEADER
    ================================================== */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      border-bottom:
        1px solid #ddd;
    }

    .top {
      display: none;
    }

    .status {
      color: #999;
      font-size: 11px;
    }


    /* ==================================================
       CHANNEL NAVIGATION
    ================================================== */

    nav {
      display: flex;

      gap: 16px;

      padding:
        12px 16px;

      flex-wrap: nowrap;

      white-space: nowrap;

      overflow-x: auto;
      overflow-y: hidden;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width: none;

      overscroll-behavior-x:
        contain;
    }

    nav::-webkit-scrollbar {
      display: none;
    }

    nav button {
      flex:
        0 0 auto;

      border: 0;

      padding: 0;
      margin: 0;

      background: transparent;
      color: #999;

      font-family: inherit;
      font-size: 13px;

      white-space: nowrap;

      cursor: pointer;
    }

    nav button:hover,
    nav button.active {
      color: #111;
    }


    /* ==================================================
       MAIN
    ================================================== */

    main {
      padding:
        18px 16px 60px;
    }

    .channel-title {
      margin:
        0 0 20px;

      font-size: 13px;
      font-weight: normal;
    }


    /* ==================================================
       MASONRY GRID
    ================================================== */

    .grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0, 1fr)
        );

      gap:
        20px 16px;

      align-items: start;
    }


    /*
     * Each column is a normal vertical
     * flex stack.
     *
     * JavaScript controls which item
     * goes into which column.
     */

    .masonry-column {

      min-width: 0;

      display: flex;

      flex-direction: column;

      gap: 20px;
    }


    /* ==================================================
       BLOCK
    ================================================== */

    .block {
      min-width: 0;

      width: 100%;
    }

    .block img {

      display: block;

      width: 100%;
      height: auto;

      background: #f5f5f5;
    }


    /* ==================================================
       IMAGE HOVER
    ================================================== */

    /*
     * Image blocks become the positioning
     * container for the hover description.
     */

    .image-block {
      position: relative;
    }


    /*
     * The image link needs to be a block
     * so the image fills its container.
     */

    .image-block > a {
      display: block;
      position: relative;
    }


    /*
     * Smooth image fade.
     */

    .image-block > a > img {

      transition:
        opacity 0.25s ease;

    }


    /*
     * On hover, the image fades to 15%.
     *
     * Change 0.15 to:
     *
     * 0.10 = 10%
     * 0.15 = 15%
     * 0.20 = 20%
     */

    .image-block:hover > a > img {
      opacity: 0.15;
    }


    /* ==================================================
       HOVER DESCRIPTION / THOUGHT
    ================================================== */

    .image-note {

      position: absolute;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 25px;

      color: #111;

      font-size: 13px;

      line-height: 1.45;

      text-align: center;

      /*
       * Allows line breaks from your
       * Are.na description to remain.
       */

      white-space: pre-wrap;

      /*
       * Hidden until hover.
       */

      opacity: 0;

      /*
       * This means the description
       * doesn't interfere with clicking
       * the image underneath.
       */

      pointer-events: none;

      transition:
        opacity 0.25s ease;
    }


    /*
     * Show your thought when hovering
     * over the image.
     */

    .image-block:hover .image-note {
      opacity: 1;
    }


    /* ==================================================
       VIDEO
    ================================================== */

    .video-link {

      display: block;

      cursor: pointer;
    }

    .block video {

      display: block;

      width: 100%;
      height: auto;

      background: #f5f5f5;

      object-fit: contain;

      pointer-events: none;
    }


    /* ==================================================
       CAPTION
    ================================================== */

    .caption {

      margin-top: 6px;

      color: #777;

      font-size: 11px;
    }


    /* ==================================================
       TEXT
    ================================================== */

    .text-block {

      padding: 12px;

      background: #f4f4f4;

      white-space: pre-wrap;
    }


    /* ==================================================
       LINKS
    ================================================== */

    .link-block {

      display: block;

      border-top:
        1px solid #ccc;

      padding-top: 7px;
    }

    .link-block img {

      display: block;

      width: 100%;

      margin-bottom: 7px;
    }

    .link-title {
      font-size: 13px;
    }

    .link-url {

      margin-top: 3px;

      color: #999;

      font-size: 11px;

      word-break: break-word;
    }


    /* ==================================================
       MESSAGES
    ================================================== */

    .message {

      padding: 40px 0;

      color: #999;
    }


    /* ==================================================
       LOAD MORE
    ================================================== */

    .load-more {

      display: block;

      margin:
        45px auto 0;

      border: 0;

      background: transparent;

      color: #888;

      font-family: inherit;

      font-size: 12px;

      cursor: pointer;
    }

    .load-more:hover {
      color: #111;
    }


    /* ==================================================
       SCROLL TO TOP
    ================================================== */

    #scrollTop {

      position: fixed;

      left: 50%;

      bottom: 15px;

      transform:
        translateX(-50%);

      z-index: 999999;

      display: none;

      border: 0;

      padding:
        5px 8px;

      margin: 0;

      background:
        rgba(
          255,
          255,
          255,
          0.95
        );

      color: #888;

      font-family: inherit;

      font-size: 11px;

      line-height: 1;

      cursor: pointer;
    }

    #scrollTop:hover {
      color: #111;
    }


    /* ==================================================
       TABLET
    ================================================== */

    @media (
      max-width: 800px
    ) {

      .grid {

        grid-template-columns:
          repeat(
            3,
            minmax(0, 1fr)
          );

        gap:
          18px 14px;
      }

      .masonry-column {
        gap: 18px;
      }

    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (
      max-width: 550px
    ) {

      body {
        font-size: 12px;
      }

      nav {

        padding-left: 12px;

        padding-right: 12px;

        padding-bottom: 10px;

        gap: 13px;

        flex-wrap: nowrap;

        overflow-x: auto;
      }

      nav button {
        font-size: 12px;
      }

      main {

        padding:
          14px 12px 50px;
      }

      .grid {

        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );

        gap:
          16px 10px;
      }

      .masonry-column {
        gap: 16px;
      }

      #scrollTop {
        bottom: 12px;
      }


      /*
       * Mobile/touch devices don't have
       * a reliable hover interaction.
       *
       * Therefore the image stays at
       * full opacity and the thought
       * appears underneath.
       */

      .image-block:hover > a > img {
        opacity: 1;
      }

      .image-note {

        position: static;

        display: block;

        padding:
          6px 0 0;

        color: #777;

        font-size: 11px;

        line-height: 1.4;

        text-align: left;

        opacity: 1;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="top">

    <div
      class="status"
      id="status"
    ></div>

  </div>


  <nav id="nav"></nav>

</header>


<main>

  <h1
    class="channel-title"
    id="title"
  >
    all
  </h1>


  <div
    class="grid"
    id="grid"
  >

    <div class="message">
      loading…
    </div>

  </div>


  <button
    class="load-more"
    id="loadMore"
    style="display:none"
  >
    load more
  </button>

</main>


<button
  id="scrollTop"
  type="button"
  aria-label="Scroll to top"
>
  ↑ top
</button>


<script>


/* ==================================================
   SETTINGS
================================================== */

const USER =
  "emy-fuplg6fvywk";

const API =
  "https://api.are.na/v3";

const PER_PAGE =
  100;

const REFRESH_INTERVAL =
  5 * 60 * 1000;

const SCROLL_THRESHOLD =
  30;


/* ==================================================
   STATE
================================================== */

let channels = [];

let currentChannel = null;

let currentPage = 1;

let hasMore = false;

let loading = false;

let refreshTimer = null;

let viewRequestId = 0;


/* ==================================================
   API REQUEST
================================================== */

async function request(url) {

  const response =
    await fetch(
      url,
      {
        /*
         * no-cache makes sure the browser
         * checks for fresh Are.na data.
         */

        cache:
          "no-cache"
      }
    );


  if (!response.ok) {

    throw new Error(
      "API error " +
      response.status
    );

  }


  return response.json();

}


/* ==================================================
   LOAD CHANNELS
================================================== */

async function loadChannels() {

  try {

    setStatus(
      "loading…"
    );


    let page = 1;

    let everything = [];


    while (true) {

      const result =
        await request(
          `${API}/users/${USER}/contents?page=${page}&per=${PER_PAGE}`
        );


      if (result.data) {

        everything.push(
          ...result.data
        );

      }


      if (
        !result.meta ||
        !result.meta.has_more_pages
      ) {

        break;

      }


      page++;

    }


    channels =
      everything.filter(
        item =>
          item.type ===
          "Channel"
      );


    const ids =
      new Set();


    channels =
      channels.filter(
        channel => {

          if (
            ids.has(
              channel.id
            )
          ) {

            return false;

          }


          ids.add(
            channel.id
          );


          return true;

        }
      );


    channels.sort(
      (a, b) =>
        a.title.localeCompare(
          b.title
        )
    );


    buildNav();


    setStatus("");


    await showAll();


    startAutoRefresh();


  } catch (error) {

    console.error(
      "CHANNEL LIST ERROR:",
      error
    );


    setStatus("");


    showError(
      "Couldn't load your channels."
    );

  }

}


/* ==================================================
   BUILD NAVIGATION
================================================== */

function buildNav() {

  const nav =
    document.getElementById(
      "nav"
    );


  nav.innerHTML =
    "";


  const all =
    document.createElement(
      "button"
    );


  all.textContent =
    "all";


  all.dataset.id =
    "all";


  all.classList.add(
    "active"
  );


  all.onclick =
    showAll;


  nav.appendChild(
    all
  );


  channels.forEach(
    channel => {

      const button =
        document.createElement(
          "button"
        );


      button.textContent =
        channel.title;


      button.dataset.id =
        channel.id;


      button.onclick =
        () =>
          showChannel(
            channel
          );


      nav.appendChild(
        button
      );

    }
  );

}


/* ==================================================
   ACTIVE NAV
================================================== */

function setActive(id) {

  document
    .querySelectorAll(
      "#nav button"
    )
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );


        if (
          String(
            button.dataset.id
          )
          ===
          String(id)
        ) {

          button.classList.add(
            "active"
          );

        }

      }
    );

}


/* ==================================================
   FETCH ALL CHANNEL BLOCKS
================================================== */

async function fetchAllChannelBlocks(
  channel
) {

  let page = 1;

  let blocks = [];


  while (true) {

    const result =
      await request(
        `${API}/channels/${channel.id}/contents?page=${page}&per=${PER_PAGE}`
      );


    if (result.data) {

      blocks.push(
        ...result.data
      );

    }


    if (
      !result.meta ||
      !result.meta.has_more_pages
    ) {

      break;

    }


    page++;

  }


  return blocks;

}


/* ==================================================
   CHRONOLOGICAL SORT
================================================== */

function sortChronologically(
  blocks
) {

  return blocks.sort(
    (a, b) => {

      const dateA =
        new Date(
          a.created_at ||
          0
        ).getTime();


      const dateB =
        new Date(
          b.created_at ||
          0
        ).getTime();


      /*
       * Newest first.
       *
       * Therefore:
       *
       * blocks[0]
       * = newest
       * = top-left
       */

      return dateB -
        dateA;

    }
  );

}


/* ==================================================
   COLUMN COUNT
================================================== */

function getColumnCount() {

  const width =
    window.innerWidth;


  if (
    width <= 550
  ) {

    return 2;

  }


  if (
    width <= 800
  ) {

    return 3;

  }


  return 4;

}


/* ==================================================
   CREATE EMPTY COLUMNS
================================================== */

function createColumns() {

  const grid =
    document.getElementById(
      "grid"
    );


  grid.innerHTML =
    "";


  const count =
    getColumnCount();


  const columns = [];


  for (
    let i = 0;
    i < count;
    i++
  ) {

    const column =
      document.createElement(
        "div"
      );


    column.className =
      "masonry-column";


    grid.appendChild(
      column
    );


    columns.push(
      column
    );

  }


  return columns;

}


/* ==================================================
   RENDER STRICT CHRONOLOGICAL MASONRY
================================================== */

function renderMasonry(
  blocks
) {

  if (!blocks.length) {

    const grid =
      document.getElementById(
        "grid"
      );


    grid.innerHTML =
      `<div class="message">
        This channel is empty.
      </div>`;


    return;

  }


  const columns =
    createColumns();


  /*
   * IMPORTANT:
   *
   * The blocks are already:
   *
   * newest → oldest
   *
   *
   * We assign them in strict
   * sequence:
   *
   * 1 → column 1
   * 2 → column 2
   * 3 → column 3
   * 4 → column 4
   * 5 → column 1
   * 6 → column 2
   *
   *
   * This means the top row is
   * always chronological.
   *
   * We do NOT put an item into
   * whichever column happens to
   * be shortest, because that
   * would destroy chronological
   * visual order.
   */

  blocks.forEach(
    (block, index) => {

      const element =
        createBlock(
          block
        );


      if (!element) {
        return;
      }


      const columnIndex =
        index %
        columns.length;


      columns[columnIndex]
        .appendChild(
          element
        );

    }
  );

}


/* ==================================================
   SHOW ALL
================================================== */

async function showAll(
  preserveScroll = false
) {

  const requestId =
    ++viewRequestId;


  currentChannel =
    null;


  currentPage =
    1;


  hasMore =
    false;


  setActive(
    "all"
  );


  if (!preserveScroll) {

    reset();

  }


  document.getElementById(
    "title"
  ).textContent =
    "all";


  showLoading();


  try {

    const results =
      await Promise.all(

        channels.map(
          async channel => {

            const blocks =
              await fetchAllChannelBlocks(
                channel
              );


            return {
              channel,
              blocks
            };

          }
        )

      );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    let blocks = [];


    results.forEach(
      result => {

        result.blocks.forEach(
          block => {

            if (
              block.type ===
              "Channel"
            ) {

              return;

            }


            blocks.push({

              ...block,

              sourceChannel:
                result.channel.title

            });

          }
        );

      }
    );


    /*
     * Remove duplicates.
     */

    const seen =
      new Set();


    blocks =
      blocks.filter(
        block => {

          if (
            seen.has(
              block.id
            )
          ) {

            return false;

          }


          seen.add(
            block.id
          );


          return true;

        }
      );


    /*
     * NEWEST → OLDEST
     */

    sortChronologically(
      blocks
    );


    clearLoading();


    renderMasonry(
      blocks
    );


    updateLoadMore();


  } catch (error) {

    console.error(
      "ALL ERROR:",
      error
    );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    showError(
      "Couldn't load your content."
    );

  }

}


/* ==================================================
   SHOW CHANNEL
================================================== */

async function showChannel(
  channel
) {

  const requestId =
    ++viewRequestId;


  currentChannel =
    channel;


  currentPage =
    1;


  hasMore =
    false;


  setActive(
    channel.id
  );


  reset();


  document.getElementById(
    "title"
  ).textContent =
    channel.title;


  showLoading();


  try {

    await loadChannelPage(
      channel,
      1,
      true,
      requestId
    );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    window.scrollTo({
      top: 0,
      behavior:
        "smooth"
    });


  } catch (error) {

    console.error(
      "CHANNEL ERROR:",
      error
    );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    showError(
      "Couldn't load this channel."
    );

  }

}


/* ==================================================
   LOAD CHANNEL PAGE
================================================== */

async function loadChannelPage(
  channel,
  page,
  replace,
  requestId
) {

  if (loading) {

    return;

  }


  loading =
    true;


  try {

    const result =
      await request(
        `${API}/channels/${channel.id}/contents?page=${page}&per=${PER_PAGE}`
      );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    const blocks =
      result.data ||
      [];


    sortChronologically(
      blocks
    );


    if (replace) {

      clearLoading();

      renderMasonry(
        blocks
      );

    } else {

      appendBlocks(
        blocks
      );

    }


    hasMore =
      result.meta?.has_more_pages
      || false;


    currentPage =
      result.meta?.current_page
      || page;


    updateLoadMore();


  } finally {

    loading =
      false;

  }


}


/* ==================================================
   APPEND BLOCKS
================================================== */

function appendBlocks(
  blocks
) {

  const grid =
    document.getElementById(
      "grid"
    );


  const columns =
    Array.from(
      grid.querySelectorAll(
        ".masonry-column"
      )
    );


  if (!columns.length) {

    renderMasonry(
      blocks
    );

    return;

  }


  /*
   * When loading another page,
   * we append the older content
   * after the existing content.
   *
   * This preserves:
   *
   * newest → oldest
   */

  blocks.forEach(
    block => {

      const element =
        createBlock(
          block
        );


      if (!element) {
        return;
      }


      /*
       * Find the shortest column
       * only for APPENDING older
       * content.
       *
       * The initial page remains
       * strictly chronological.
       */

      let shortest =
        columns[0];


      for (
        let i = 1;
        i < columns.length;
        i++
      ) {

        if (
          columns[i].offsetHeight <
          shortest.offsetHeight
        ) {

          shortest =
            columns[i];

        }

      }


      shortest.appendChild(
        element
      );

    }
  );

}


/* ==================================================
   LOAD MORE
================================================== */

document
  .getElementById(
    "loadMore"
  )
  .onclick =
  async function() {

    if (
      !currentChannel ||
      !hasMore ||
      loading
    ) {

      return;

    }


    this.textContent =
      "loading…";


    await loadChannelPage(
      currentChannel,
      currentPage + 1,
      false,
      viewRequestId
    );


    this.textContent =
      "load more";

  };


/* ==================================================
   GET DESCRIPTION
================================================== */

/*
 * This function reads your Are.na description.
 *
 * It supports:
 *
 * 1. description as a normal string
 *
 * 2. description.plain
 *
 * 3. description.text
 *
 * This makes the code more tolerant
 * of the way Are.na returns the field.
 */

function getBlockDescription(
  block
) {

  if (
    typeof block.description ===
    "string"
  ) {

    return block.description.trim();

  }


  if (
    block.description &&
    typeof block.description.plain ===
    "string"
  ) {

    return block.description.plain.trim();

  }


  if (
    block.description &&
    typeof block.description.text ===
    "string"
  ) {

    return block.description.text.trim();

  }


  return "";

}


/* ==================================================
   CREATE BLOCK
================================================== */

function createBlock(
  block
) {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "block";


  /* ==================================================
     IMAGE
  ================================================== */

  if (
    block.type ===
    "Image"
  ) {

    /*
     * Make this block an image-block
     * so the hover CSS applies only
     * to images.
     */

    wrapper.classList.add(
      "image-block"
    );


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (!imageUrl) {

      return null;

    }


    const link =
      document.createElement(
        "a"
      );


    link.href =
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const image =
      document.createElement(
        "img"
      );


    image.src =
      imageUrl;


    image.alt =
      block.title ||
      block.image?.alt_text ||
      "";


    image.loading =
      "lazy";


    image.decoding =
      "async";


    image.onerror =
      function() {

        wrapper.remove();

      };


    link.appendChild(
      image
    );


    wrapper.appendChild(
      link
    );


    /* ==================================================
       HOVER DESCRIPTION
    ================================================== */

    const description =
      getBlockDescription(
        block
      );


    /*
     * Only create the hover text
     * if you actually wrote a description
     * in Are.na.
     */

    if (
      description
    ) {

      const note =
        document.createElement(
          "div"
        );


      note.className =
        "image-note";


      /*
       * textContent is intentional.
       *
       * Your Are.na description is treated
       * as text, not HTML.
       */

      note.textContent =
        description;


      wrapper.appendChild(
        note
      );

    }


    /* ==================================================
       TITLE / CAPTION
    ================================================== */

    /*
     * IMPORTANT:
     *
     * The title remains underneath
     * the image exactly as before.
     */

    if (block.title) {

      const caption =
        document.createElement(
          "div"
        );


      caption.className =
        "caption";


      caption.textContent =
        block.title;


      wrapper.appendChild(
        caption
      );

    }


    return wrapper;

  }


  /* ==================================================
     TEXT
  ================================================== */

  if (
    block.type ===
    "Text"
  ) {

    const text =
      document.createElement(
        "div"
      );


    text.className =
      "text-block";


    text.textContent =
      block.content?.plain ||
      "";


    wrapper.appendChild(
      text
    );


    return wrapper;

  }


  /* ==================================================
     LINK
  ================================================== */

  if (
    block.type ===
    "Link"
  ) {

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "link-block";


    link.href =
      block.url ||
      block.source?.url ||
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (imageUrl) {

      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageUrl;


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.onerror =
        function() {

          image.style.display =
            "none";

        };


      link.appendChild(
        image
      );

    }


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "link-title";


    title.textContent =
      block.title ||
      block.source?.title ||
      "link";


    link.appendChild(
      title
    );


    const url =
      document.createElement(
        "div"
      );


    url.className =
      "link-url";


    url.textContent =
      block.url ||
      block.source?.url ||
      "";


    link.appendChild(
      url
    );


    wrapper.appendChild(
      link
    );


    return wrapper;

  }


  /* ==================================================
     ATTACHMENT / VIDEO
  ================================================== */

  if (
    block.type ===
    "Attachment"
  ) {

    const attachmentUrl =
      block.attachment?.url ||
      block.attachment?.file_url ||
      block.url ||
      block.original?.url;


    const contentType =
      block.content_type ||
      block.attachment?.content_type ||
      "";


    const isVideo =
      contentType.startsWith(
        "video/"
      ) ||
      (
        attachmentUrl &&
        /\.(mp4|webm|mov|m4v|ogv)(\?.*)?$/i.test(
          attachmentUrl
        )
      );


    /* ==================================================
       VIDEO
    ================================================== */

    if (
      isVideo &&
      attachmentUrl
    ) {

      const link =
        document.createElement(
          "a"
        );


      link.className =
        "video-link";


      link.href =
        `https://www.are.na/block/${block.id}`;


      link.target =
        "_blank";


      link.rel =
        "noopener noreferrer";


      const video =
        document.createElement(
          "video"
        );


      video.src =
        attachmentUrl;


      video.autoplay =
        true;


      video.muted =
        true;


      video.loop =
        true;


      video.playsInline =
        true;


      video.setAttribute(
        "autoplay",
        ""
      );


      video.setAttribute(
        "muted",
        ""
      );


      video.setAttribute(
        "loop",
        ""
      );


      video.setAttribute(
        "playsinline",
        ""
      );


      video.controls =
        false;


      video.addEventListener(
        "canplay",
        function() {

          video.play().catch(
            function() {}
          );

        }
      );


      link.appendChild(
        video
      );


      wrapper.appendChild(
        link
      );


      if (block.title) {

        const caption =
          document.createElement(
            "div"
          );


        caption.className =
          "caption";


        caption.textContent =
          block.title;


        wrapper.appendChild(
          caption
        );

      }


      return wrapper;

    }


    /* ==================================================
       NORMAL ATTACHMENT
    ================================================== */

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "link-block";


    link.href =
      block.url ||
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (imageUrl) {

      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageUrl;


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.onerror =
        function() {

          image.style.display =
            "none";

        };


      link.appendChild(
        image
      );

    }


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "link-title";


    title.textContent =
      block.title ||
      block.filename ||
      "attachment";


    link.appendChild(
      title
    );


    wrapper.appendChild(
      link
    );


    return wrapper;

  }


  /* ==================================================
     EMBED
  ================================================== */

  if (
    block.type ===
    "Embed"
  ) {

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "link-block";


    link.href =
      block.embed?.source_url ||
      block.source?.url ||
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (imageUrl) {

      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageUrl;


      image.loading =
        "lazy";


      image.decoding =
        "async";


      link.appendChild(
        image
      );

    }


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "link-title";


    title.textContent =
      block.title ||
      "embed";


    link.appendChild(
      title
    );


    wrapper.appendChild(
      link
    );


    return wrapper;

  }


  return null;

}


/* ==================================================
   RESET
================================================== */

function reset() {

  document.getElementById(
    "grid"
  ).innerHTML =
    "";


  document.getElementById(
    "loadMore"
  ).style.display =
    "none";


  currentPage =
    1;


  hasMore =
    false;

}


/* ==================================================
   LOADING
================================================== */

function showLoading() {

  document.getElementById(
    "grid"
  ).innerHTML =
    `<div class="message">
      loading…
    </div>`;

}


function clearLoading() {

  document
    .querySelectorAll(
      ".message"
    )
    .forEach(
      message =>
        message.remove()
    );

}


/* ==================================================
   ERROR
================================================== */

function showError(
  message
) {

  document.getElementById(
    "grid"
  ).innerHTML =
    `<div class="message">
      ${message}
    </div>`;

}


/* ==================================================
   LOAD MORE UI
================================================== */

function updateLoadMore() {

  const button =
    document.getElementById(
      "loadMore"
    );


  if (
    currentChannel &&
    hasMore
  ) {

    button.style.display =
      "block";

  } else {

    button.style.display =
      "none";

  }

}


/* ==================================================
   STATUS
================================================== */

function setStatus(
  text
) {

  document.getElementById(
    "status"
  ).textContent =
    text;

}


/* ==================================================
   AUTOMATIC REFRESH
================================================== */

function startAutoRefresh() {

  if (refreshTimer) {

    clearInterval(
      refreshTimer
    );

  }


  refreshTimer =
    setInterval(
      async function() {

        if (
          document.visibilityState !==
          "visible"
        ) {

          return;

        }


        if (
          currentChannel
        ) {

          await refreshCurrentChannel();

        } else {

          await showAll(
            true
          );

        }

      },
      REFRESH_INTERVAL
    );

}


/* ==================================================
   REFRESH CURRENT CHANNEL
================================================== */

async function refreshCurrentChannel() {

  if (
    !currentChannel ||
    loading
  ) {

    return;

  }


  const requestId =
    ++viewRequestId;


  try {

    const result =
      await request(
        `${API}/channels/${currentChannel.id}/contents?page=1&per=${PER_PAGE}`
      );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    const blocks =
      result.data ||
      [];


    sortChronologically(
      blocks
    );


    /*
     * Re-rendering here means that if
     * you edit a title or description
     * in Are.na, the updated version
     * gets pulled into the page.
     */

    renderMasonry(
      blocks
    );


    hasMore =
      result.meta?.has_more_pages
      || false;


    currentPage =
      result.meta?.current_page
      || 1;


    updateLoadMore();


  } catch (error) {

    console.error(
      "AUTO REFRESH ERROR:",
      error
    );

  }

}


/* ==================================================
   SCROLL TO TOP
================================================== */

const scrollTopButton =
  document.getElementById(
    "scrollTop"
  );


function getScrollPosition() {

  return Math.max(

    window.scrollY || 0,

    window.pageYOffset || 0,

    document.documentElement.scrollTop || 0,

    document.body.scrollTop || 0

  );

}


function updateScrollTopButton() {

  const position =
    getScrollPosition();


  if (
    position >=
    SCROLL_THRESHOLD
  ) {

    scrollTopButton.style.display =
      "block";

  } else {

    scrollTopButton.style.display =
      "none";

  }

}


window.addEventListener(
  "scroll",
  updateScrollTopButton,
  {
    passive: true
  }
);


document.addEventListener(
  "scroll",
  updateScrollTopButton,
  {
    passive: true
  }
);


setInterval(
  updateScrollTopButton,
  100
);


updateScrollTopButton();


/* ==================================================
   SCROLL TO TOP CLICK
================================================== */

scrollTopButton.addEventListener(
  "click",
  function() {

    window.scrollTo({
      top: 0,
      left: 0,
      behavior: "smooth"
    });


    document.documentElement.scrollTo({
      top: 0,
      left: 0,
      behavior: "smooth"
    });


    document.body.scrollTo({
      top: 0,
      left: 0,
      behavior: "smooth"
    });


    scrollTopButton.style.display =
      "none";

  }
);


/* ==================================================
   RESPONSIVE REBUILD
================================================== */

let resizeTimer = null;

let previousColumnCount =
  getColumnCount();


window.addEventListener(
  "resize",
  function() {

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        async function() {

          const newColumnCount =
            getColumnCount();


          if (
            newColumnCount ===
            previousColumnCount
          ) {

            return;

          }


          previousColumnCount =
            newColumnCount;


          /*
           * Rebuild the current
           * view so the chronological
           * order remains correct
           * after changing column count.
           */

          if (
            currentChannel
          ) {

            await refreshCurrentChannel();

          } else {

            await showAll(
              true
            );

          }

        },
        200
      );

  }
);


/* ==================================================
   START
================================================== */

loadChannels();

</script>
