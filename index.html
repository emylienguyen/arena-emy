<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>emy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      line-height: 1.35;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ------------------------------
       HEADER
    ------------------------------ */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #ddd;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 8px;
    }

    .name {
      font-size: 13px;
      font-weight: normal;
    }

    .status {
      color: #999;
      font-size: 11px;
    }

    /* ------------------------------
       CHANNEL NAVIGATION
    ------------------------------ */

    nav {
      display: flex;
      gap: 16px;
      padding: 0 16px 12px;

      overflow-x: auto;
      white-space: nowrap;

      scrollbar-width: none;
    }

    nav::-webkit-scrollbar {
      display: none;
    }

    nav button {
      border: 0;
      padding: 0;
      margin: 0;

      background: transparent;

      color: #999;

      font-family: inherit;
      font-size: 13px;

      cursor: pointer;
    }

    nav button:hover,
    nav button.active {
      color: #111;
    }

    /* ------------------------------
       MAIN
    ------------------------------ */

    main {
      padding: 18px 16px 60px;
    }

    .channel-header {
      margin-bottom: 20px;
    }

    .channel-title {
      margin: 0;
      font-size: 13px;
      font-weight: normal;
    }

    .channel-description {
      max-width: 600px;
      margin-top: 5px;
      color: #777;
    }

    /* ------------------------------
       GRID
    ------------------------------ */

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px 16px;
      align-items: start;
    }

    .block {
      min-width: 0;
    }

    .block img {
      display: block;
      width: 100%;
      height: auto;

      background: #f5f5f5;

      object-fit: contain;
    }

    .block img.loading {
      min-height: 40px;
    }

    /* ------------------------------
       CAPTIONS
    ------------------------------ */

    .caption {
      margin-top: 6px;

      color: #777;

      font-size: 11px;
      line-height: 1.35;
    }

    /* ------------------------------
       TEXT BLOCKS
    ------------------------------ */

    .text-block {
      padding: 12px;

      background: #f4f4f4;

      white-space: pre-wrap;
    }

    /* ------------------------------
       LINK BLOCKS
    ------------------------------ */

    .link-block {
      display: block;

      border-top: 1px solid #ccc;

      padding-top: 7px;
    }

    .link-block img {
      margin-bottom: 7px;
    }

    .link-title {
      font-size: 13px;
    }

    .link-url {
      margin-top: 3px;

      color: #999;

      font-size: 11px;

      word-break: break-word;
    }

    /* ------------------------------
       LOADING / ERROR
    ------------------------------ */

    .message {
      padding: 40px 0;

      color: #999;
    }

    .load-more {
      margin: 45px auto 0;

      display: block;

      border: 0;
      background: transparent;

      color: #888;

      font-family: inherit;
      font-size: 12px;

      cursor: pointer;
    }

    .load-more:hover {
      color: #111;
    }

    /* ------------------------------
       MOBILE
    ------------------------------ */

    @media (max-width: 800px) {

      .grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

    }

    @media (max-width: 550px) {

      body {
        font-size: 12px;
      }

      .header-top {
        padding: 10px 12px 7px;
      }

      nav {
        padding-left: 12px;
        padding-right: 12px;
        padding-bottom: 10px;

        gap: 13px;
      }

      nav button {
        font-size: 12px;
      }

      main {
        padding: 14px 12px 50px;
      }

      .grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 16px 10px;
      }

    }

  </style>
</head>

<body>

<header>

  <div class="header-top">

    <div class="name">
      emy
    </div>

    <div
      class="status"
      id="status"
    ></div>

  </div>

  <nav id="channelNav">
    <button
      class="active"
      data-channel="all"
    >
      all
    </button>
  </nav>

</header>


<main>

  <div class="channel-header">

    <h1
      class="channel-title"
      id="channelTitle"
    >
      all
    </h1>

    <div
      class="channel-description"
      id="channelDescription"
    ></div>

  </div>


  <div
    class="grid"
    id="content"
  >

    <div class="message">
      loading…
    </div>

  </div>


  <button
    class="load-more"
    id="loadMore"
    style="display:none"
  >
    load more
  </button>

</main>


<script>

  /*
   * ==========================================
   * SETTINGS
   * ==========================================
   */

  const USER = "emy-fuplg6fvywk";

  const API = "https://api.are.na/v3";

  const PER_PAGE = 50;


  /*
   * ==========================================
   * STATE
   * ==========================================
   */

  let channels = [];

  let currentChannel = null;

  let currentPage = 1;

  let loading = false;

  let hasMore = false;


  /*
   * ==========================================
   * API
   * ==========================================
   */

  async function api(url) {

    const response = await fetch(url);

    if (!response.ok) {

      throw new Error(
        `Are.na API returned ${response.status}`
      );

    }

    return await response.json();

  }


  /*
   * ==========================================
   * GET ALL PAGES FROM A USER
   *
   * We use this only for the channel list.
   * Are.na's user endpoint is paginated.
   * ==========================================
   */

  async function getUserContents() {

    let page = 1;

    let all = [];

    while (true) {

      const result = await api(
        `${API}/users/${USER}/contents?page=${page}&per=100`
      );

      if (result.data) {
        all.push(...result.data);
      }

      if (
        !result.meta ||
        !result.meta.has_more_pages
      ) {
        break;
      }

      page++;

    }

    return all;

  }


  /*
   * ==========================================
   * LOAD CHANNELS
   * ==========================================
   */

  async function loadChannels() {

    setStatus("loading…");

    try {

      const contents =
        await getUserContents();

      /*
       * Only channels created/owned by you.
       *
       * We intentionally ignore:
       *
       * - channels you collaborate on
       * - channels created by other users
       */

      channels =
        contents.filter(
          item =>
            item.type === "Channel"
        );


      /*
       * Remove duplicates.
       */

      const seen = new Set();

      channels =
        channels.filter(channel => {

          if (seen.has(channel.id)) {
            return false;
          }

          seen.add(channel.id);

          return true;

        });


      /*
       * Alphabetical navigation.
       */

      channels.sort(
        (a, b) =>
          a.title.localeCompare(b.title)
      );


      buildNavigation();

      setStatus("");

      showAll();

    } catch (error) {

      console.error(error);

      setStatus("");

      showError(
        "Couldn't load your Are.na channels."
      );

    }

  }


  /*
   * ==========================================
   * NAVIGATION
   * ==========================================
   */

  function buildNavigation() {

    const nav =
      document.getElementById(
        "channelNav"
      );

    nav.innerHTML = "";


    /*
     * ALL
     */

    const all =
      document.createElement("button");

    all.textContent = "all";

    all.dataset.channel = "all";

    all.classList.add("active");

    all.onclick = showAll;

    nav.appendChild(all);


    /*
     * CHANNELS
     */

    channels.forEach(channel => {

      const button =
        document.createElement("button");

      button.textContent =
        channel.title;

      button.dataset.channel =
        channel.id;

      button.onclick = () =>
        showChannel(channel);

      nav.appendChild(button);

    });

  }


  /*
   * ==========================================
   * ACTIVE NAV ITEM
   * ==========================================
   */

  function setActive(id) {

    document
      .querySelectorAll(
        "#channelNav button"
      )
      .forEach(button => {

        button.classList.remove(
          "active"
        );

        if (
          String(button.dataset.channel)
          === String(id)
        ) {

          button.classList.add(
            "active"
          );

        }

      });

  }


  /*
   * ==========================================
   * RESET CONTENT
   * ==========================================
   */

  function resetContent() {

    document.getElementById(
      "content"
    ).innerHTML = "";

    currentPage = 1;

    hasMore = false;

  }


  /*
   * ==========================================
   * SHOW ALL
   *
   * The ALL view displays blocks from
   * your personally created channels.
   *
   * It loads the first page of each channel,
   * rather than downloading everything.
   * ==========================================
   */

  async function showAll() {

    currentChannel = null;

    setActive("all");

    resetContent();

    document.getElementById(
      "channelTitle"
    ).textContent = "all";

    document.getElementById(
      "channelDescription"
    ).textContent = "";

    hideLoadMore();

    showLoading();

    try {

      /*
       * Fetch the first page of every
       * channel simultaneously.
       */

      const responses =
        await Promise.all(

          channels.map(channel =>
            api(
              `${API}/channels/${channel.id}/contents?page=1&per=${PER_PAGE}&sort=position`
            )
          )

        );


      let blocks = [];


      responses.forEach(
        (result, index) => {

          const channel =
            channels[index];


          if (!result.data) {
            return;
          }


          result.data.forEach(block => {

            /*
             * Don't show nested channels
             * inside ALL.
             */

            if (
              block.type !== "Channel"
            ) {

              blocks.push({

                ...block,

                sourceChannel:
                  channel.title,

                sourceChannelId:
                  channel.id

              });

            }

          });

        }
      );


      clearLoading();

      if (!blocks.length) {

        showEmpty(
          "No content yet."
        );

        return;

      }


      renderBlocks(blocks);

    } catch (error) {

      console.error(error);

      showError(
        "Couldn't load your content."
      );

    }

  }


  /*
   * ==========================================
   * SHOW CHANNEL
   * ==========================================
   */

  async function showChannel(channel) {

    currentChannel = channel;

    currentPage = 1;

    setActive(channel.id);

    resetContent();

    document.getElementById(
      "channelTitle"
    ).textContent =
      channel.title;


    /*
     * Description
     */

    const description =
      channel.description?.plain ||
      "";

    document.getElementById(
      "channelDescription"
    ).textContent =
      description;


    showLoading();


    try {

      await loadChannelPage(
        channel,
        1,
        true
      );

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    } catch (error) {

      console.error(error);

      showError(
        "Couldn't load this channel."
      );

    }

  }


  /*
   * ==========================================
   * LOAD CHANNEL PAGE
   * ==========================================
   */

  async function loadChannelPage(
    channel,
    page,
    replace = false
  ) {

    if (loading) {
      return;
    }

    loading = true;


    try {

      const result =
        await api(
          `${API}/channels/${channel.id}/contents?page=${page}&per=${PER_PAGE}&sort=position`
        );


      const blocks =
        result.data || [];


      if (replace) {
        clearLoading();
      }


      renderBlocks(
        blocks,
        replace
      );


      /*
       * Pagination info from V3.
       */

      hasMore =
        result.meta?.has_more_pages ||
        false;

      currentPage =
        result.meta?.current_page ||
        page;


      if (hasMore) {
        showLoadMore();
      } else {
        hideLoadMore();
      }


    } finally {

      loading = false;

    }

  }


  /*
   * ==========================================
   * LOAD MORE
   * ==========================================
   */

  document
    .getElementById("loadMore")
    .addEventListener(
      "click",
      async () => {

        if (
          !currentChannel ||
          !hasMore ||
          loading
        ) {
          return;
        }


        const nextPage =
          currentPage + 1;


        const button =
          document.getElementById(
            "loadMore"
          );

        button.textContent =
          "loading…";


        try {

          await loadChannelPage(
            currentChannel,
            nextPage,
            false
          );

        } finally {

          if (hasMore) {
            button.textContent =
              "load more";
          }

        }

      }
    );


  /*
   * ==========================================
   * RENDER BLOCKS
   * ==========================================
   */

  function renderBlocks(
    blocks,
    replace = false
  ) {

    const container =
      document.getElementById(
        "content"
      );


    if (replace) {
      container.innerHTML = "";
    }


    blocks.forEach(block => {

      const element =
        createBlock(block);

      if (element) {
        container.appendChild(
          element
        );
      }

    });

  }


  /*
   * ==========================================
   * CREATE BLOCK
   * ==========================================
   */

  function createBlock(block) {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "block";


    /*
     * ----------------------------------------
     * IMAGE
     * ----------------------------------------
     */

    if (
      block.type === "Image"
    ) {

      const imageUrl =
        getImageUrl(block);


      /*
       * If there's no usable image URL,
       * don't make an empty grid item.
       */

      if (!imageUrl) {
        return null;
      }


      const link =
        document.createElement("a");

      link.href =
        getBlockUrl(block);

      link.target = "_blank";

      link.rel =
        "noopener noreferrer";


      const image =
        document.createElement("img");

      image.src =
        imageUrl;

      image.alt =
        block.title ||
        block.image?.alt_text ||
        "";

      image.loading =
        "lazy";


      /*
       * If one image fails, hide only
       * that particular block.
       */

      image.onerror =
        () => {

          wrapper.style.display =
            "none";

        };


      link.appendChild(image);

      wrapper.appendChild(link);


      if (block.title) {

        const caption =
          document.createElement(
            "div"
          );

        caption.className =
          "caption";

        caption.textContent =
          block.title;

        wrapper.appendChild(
          caption
        );

      }


      return wrapper;

    }


    /*
     * ----------------------------------------
     * TEXT
     * ----------------------------------------
     */

    if (
      block.type === "Text"
    ) {

      const text =
        document.createElement(
          "div"
        );

      text.className =
        "text-block";


      /*
       * V3 Text blocks expose markdown
       * content with a plain representation.
       */

      text.textContent =
        block.content?.plain ||
        "";


      wrapper.appendChild(text);

      return wrapper;

    }


    /*
     * ----------------------------------------
     * LINK
     * ----------------------------------------
     */

    if (
      block.type === "Link"
    ) {

      const link =
        document.createElement(
          "a"
        );

      link.className =
        "link-block";

      link.href =
        getBlockExternalUrl(
          block
        );

      link.target = "_blank";

      link.rel =
        "noopener noreferrer";


      /*
       * Link preview image.
       */

      const imageUrl =
        getImageUrl(block);


      if (imageUrl) {

        const image =
          document.createElement(
            "img"
          );

        image.src =
          imageUrl;

        image.alt =
          block.title || "";

        image.loading =
          "lazy";


        image.onerror =
          () => {

            image.style.display =
              "none";

          };


        link.appendChild(image);

      }


      const title =
        document.createElement(
          "div"
        );

      title.className =
        "link-title";

      title.textContent =
        block.title ||
        block.source?.title ||
        block.url ||
        "link";


      link.appendChild(title);


      const url =
        document.createElement(
          "div"
        );

      url.className =
        "link-url";

      url.textContent =
        block.url ||
        block.source?.url ||
        "";


      link.appendChild(url);

      wrapper.appendChild(link);

      return wrapper;

    }


    /*
     * ----------------------------------------
     * ATTACHMENT
     * ----------------------------------------
     */

    if (
      block.type === "Attachment"
    ) {

      const link =
        document.createElement(
          "a"
        );

      link.className =
        "link-block";

      link.href =
        block.url ||
        getBlockUrl(block);

      link.target = "_blank";

      link.rel =
        "noopener noreferrer";


      const imageUrl =
        getImageUrl(block);


      if (imageUrl) {

        const image =
          document.createElement(
            "img"
          );

        image.src =
          imageUrl;

        image.loading =
          "lazy";

        image.onerror =
          () => {

            image.style.display =
              "none";

          };


        link.appendChild(image);

      }


      const title =
        document.createElement(
          "div"
        );

      title.className =
        "link-title";

      title.textContent =
        block.title ||
        block.filename ||
        "attachment";


      link.appendChild(title);

      wrapper.appendChild(link);

      return wrapper;

    }


    /*
     * ----------------------------------------
     * EMBED
     * ----------------------------------------
     */

    if (
      block.type === "Embed"
    ) {

      const link =
        document.createElement(
          "a"
        );

      link.className =
        "link-block";

      link.href =
        block.embed?.source_url ||
        block.source?.url ||
        getBlockUrl(block);

      link.target = "_blank";

      link.rel =
        "noopener noreferrer";


      const imageUrl =
        getImageUrl(block);


      if (imageUrl) {

        const image =
          document.createElement(
            "img"
          );

        image.src =
          imageUrl;

        image.loading =
          "lazy";

        image.onerror =
          () => {

            image.style.display =
              "none";

          };


        link.appendChild(image);

      }


      const title =
        document.createElement(
          "div"
        );

      title.className =
        "link-title";

      title.textContent =
        block.title ||
        block.embed?.title ||
        "embed";


      link.appendChild(title);

      wrapper.appendChild(link);

      return wrapper;

    }


    return null;

  }


  /*
   * ==========================================
   * IMAGE URL
   *
   * V3 image representations use src.
   *
   * We try the larger versions first.
   * ==========================================
   */

  function getImageUrl(block) {

    const image =
      block.image;


    if (!image) {
      return null;
    }


    return (
      image.large?.src ||
      image.medium?.src ||
      image.small?.src ||
      image.src ||
      null
    );

  }


  /*
   * ==========================================
   * BLOCK URL
   * ==========================================
   */

  function getBlockUrl(block) {

    if (
      block._links?.self?.href
    ) {

      return block
        ._links
        .self
        .href;

    }


    return (
      `https://www.are.na/block/${block.id}`
    );

  }


  /*
   * ==========================================
   * EXTERNAL URL
   * ==========================================
   */

  function getBlockExternalUrl(
    block
  ) {

    return (
      block.url ||
      block.source?.url ||
      getBlockUrl(block)
    );

  }


  /*
   * ==========================================
   * UI HELPERS
   * ==========================================
   */

  function showLoading() {

    document.getElementById(
      "content"
    ).innerHTML =
      `<div class="message">
        loading…
      </div>`;

  }


  function clearLoading() {

    const message =
      document.querySelector(
        ".message"
      );

    if (message) {
      message.remove();
    }

  }


  function showEmpty(text) {

    document.getElementById(
      "content"
    ).innerHTML =
      `<div class="message">
        ${text}
      </div>`;

  }


  function showError(text) {

    document.getElementById(
      "content"
    ).innerHTML =
      `<div class="message">
        ${text}
      </div>`;

  }


  function showLoadMore() {

    document.getElementById(
      "loadMore"
    ).style.display =
      "block";

  }


  function hideLoadMore() {

    document.getElementById(
      "loadMore"
    ).style.display =
      "none";

  }


  function setStatus(text) {

    document.getElementById(
      "status"
    ).textContent =
      text;

  }


  /*
   * ==========================================
   * START
   * ==========================================
   */

  loadChannels();

</script>

</body>
</html>
