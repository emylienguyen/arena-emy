<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>emy</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;
      line-height: 1.35;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* ==================================================
       HEADER
    ================================================== */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      border-bottom:
        1px solid #ddd;
    }

    .top {
      display: none;
    }

    .status {
      color: #999;
      font-size: 11px;
    }


    /* ==================================================
       CHANNEL NAVIGATION
    ================================================== */

    nav {
      display: flex;

      gap: 16px;

      padding:
        12px 16px;

      flex-wrap: nowrap;

      white-space: nowrap;

      overflow-x: auto;
      overflow-y: hidden;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width: none;

      overscroll-behavior-x:
        contain;
    }

    nav::-webkit-scrollbar {
      display: none;
    }

    nav button {
      flex:
        0 0 auto;

      border: 0;

      padding: 0;
      margin: 0;

      background: transparent;
      color: #999;

      font-family: inherit;
      font-size: 13px;

      white-space: nowrap;

      cursor: pointer;
    }

    nav button:hover,
    nav button.active {
      color: #111;
    }


    /* ==================================================
       MAIN
    ================================================== */

    main {
      padding:
        18px 16px 60px;
    }

    .channel-title {
      margin:
        0 0 20px;

      font-size: 13px;
      font-weight: normal;
    }


    /* ==================================================
       MASONRY GRID
    ================================================== */

    .grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0, 1fr)
        );

      gap:
        20px 16px;

      align-items: start;
    }


    .masonry-column {

      min-width: 0;

      display: flex;

      flex-direction: column;

      gap: 20px;
    }


    /* ==================================================
       BLOCK
    ================================================== */

    .block {
      min-width: 0;

      width: 100%;
    }

    .block img {

      display: block;

      width: 100%;
      height: auto;

      background: #f5f5f5;
    }


    /* ==================================================
       IMAGE HOVER
    ================================================== */

    .image-block {
      position: relative;
    }

    .image-block > a {
      display: block;
      position: relative;
    }

    .image-block > a > img {

      transition:
        opacity 0.25s ease;

    }

    .image-block:hover > a > img {
      opacity: 0.15;
    }


    /* ==================================================
       HOVER DESCRIPTION / THOUGHT
    ================================================== */

    .image-note {

      position: absolute;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 25px;

      color: #111;

      font-size: 13px;

      line-height: 1.45;

      text-align: center;

      white-space: pre-wrap;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.25s ease;
    }

    .image-block:hover .image-note {
      opacity: 1;
    }


    /* ==================================================
       VIDEO
    ================================================== */

    .video-link {

      display: block;

      cursor: pointer;
    }

    .block video {

      display: block;

      width: 100%;
      height: auto;

      background: #f5f5f5;

      object-fit: contain;

      pointer-events: none;
    }


    /* ==================================================
       CAPTION
    ================================================== */

    .caption {

      margin-top: 6px;

      color: #777;

      font-size: 11px;
    }


    /* ==================================================
       TEXT
    ================================================== */

    .text-block {

      padding: 12px;

      background: #f4f4f4;

      white-space: pre-wrap;
    }


    /* ==================================================
       LINKS
    ================================================== */

    .link-block {

      display: block;

      border-top:
        1px solid #ccc;

      padding-top: 7px;
    }

    .link-block img {

      display: block;

      width: 100%;

      margin-bottom: 7px;
    }

    .link-title {
      font-size: 13px;
    }

    .link-url {

      margin-top: 3px;

      color: #999;

      font-size: 11px;

      word-break: break-word;
    }


    /* ==================================================
       MESSAGES
    ================================================== */

    .message {

      padding: 40px 0;

      color: #999;
    }


    /* ==================================================
       LOAD MORE
    ================================================== */

    .load-more {

      display: block;

      margin:
        45px auto 0;

      border: 0;

      background: transparent;

      color: #888;

      font-family: inherit;

      font-size: 12px;

      cursor: pointer;
    }

    .load-more:hover {
      color: #111;
    }


    /* ==================================================
       SCROLL TO TOP
    ================================================== */

    #scrollTop {

      position: fixed;

      left: 50%;

      bottom: 15px;

      transform:
        translateX(-50%);

      z-index: 999999;

      display: none;

      border: 0;

      padding:
        5px 8px;

      margin: 0;

      background:
        rgba(
          255,
          255,
          255,
          0.95
        );

      color: #888;

      font-family: inherit;

      font-size: 11px;

      line-height: 1;

      cursor: pointer;
    }

    #scrollTop:hover {
      color: #111;
    }


    /* ==================================================
       TABLET
    ================================================== */

    @media (
      max-width: 800px
    ) {

      .grid {

        grid-template-columns:
          repeat(
            3,
            minmax(0, 1fr)
          );

        gap:
          18px 14px;
      }

      .masonry-column {
        gap: 18px;
      }

    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (
      max-width: 550px
    ) {

      body {
        font-size: 12px;
      }

      nav {

        padding-left: 12px;

        padding-right: 12px;

        padding-bottom: 10px;

        gap: 13px;

        flex-wrap: nowrap;

        overflow-x: auto;
      }

      nav button {
        font-size: 12px;
      }

      main {

        padding:
          14px 12px 50px;
      }

      .grid {

        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );

        gap:
          16px 10px;
      }

      .masonry-column {
        gap: 16px;
      }

      #scrollTop {
        bottom: 12px;
      }

      .image-block:hover > a > img {
        opacity: 1;
      }

      .image-note {

        position: static;

        display: block;

        padding:
          6px 0 0;

        color: #777;

        font-size: 11px;

        line-height: 1.4;

        text-align: left;

        opacity: 1;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="top">

    <div
      class="status"
      id="status"
    ></div>

  </div>


  <nav id="nav"></nav>

</header>


<main>

  <h1
    class="channel-title"
    id="title"
  >
    all
  </h1>


  <div
    class="grid"
    id="grid"
  >

    <div class="message">
      loading…
    </div>

  </div>


  <button
    class="load-more"
    id="loadMore"
    style="display:none"
  >
    load more
  </button>

</main>


<button
  id="scrollTop"
  type="button"
  aria-label="Scroll to top"
>
  ↑ top
</button>


<script>


/* ==================================================
   SETTINGS
================================================== */

const USER =
  "emy-fuplg6fvywk";

const API =
  "https://api.are.na/v3";

const PER_PAGE =
  100;


/*
 * HOW OFTEN ARE.NA IS CHECKED
 *
 * 20 seconds is intentionally fast.
 *
 * The page only performs the actual
 * re-render when something has changed.
 */

const REFRESH_INTERVAL =
  20 * 1000;


/*
 * A slower full synchronization is used
 * as a safety net.
 *
 * This is especially useful for edits to
 * older blocks that are not on page 1.
 */

const FULL_SYNC_INTERVAL =
  2 * 60 * 1000;


const SCROLL_THRESHOLD =
  30;


/*
 * Cache busting.
 *
 * Are.na's public API can be cached for
 * up to several minutes. Adding a unique
 * query parameter gives each refresh a
 * distinct URL.
 */

const CACHE_BUST =
  true;


/* ==================================================
   STATE
================================================== */

let channels = [];

let currentChannel = null;

let currentPage = 1;

let hasMore = false;

let loading = false;

let refreshTimer = null;

let fullSyncTimer = null;

let viewRequestId = 0;


/*
 * Current rendered data.
 *
 * This lets us compare new Are.na data
 * against what is already on screen.
 */

let channelCache =
  new Map();


/*
 * Stores all loaded pages for the
 * currently selected channel.
 */

let loadedChannelBlocks = [];


/*
 * Prevents multiple automatic refreshes
 * from running at the same time.
 */

let autoRefreshing = false;


/*
 * Timestamp of last full synchronization.
 */

let lastFullSync = 0;


/* ==================================================
   API REQUEST
================================================== */

async function request(
  url,
  options = {}
) {

  /*
   * Add a cache-busting parameter only
   * when requested.
   *
   * This is deliberately done at the
   * URL level rather than relying only
   * on fetch("no-cache").
   */

  if (CACHE_BUST) {

    const separator =
      url.includes("?")
        ? "&"
        : "?";

    url +=
      `${separator}_=${Date.now()}`;

  }


  const response =
    await fetch(
      url,
      {
        /*
         * Keep the browser from reusing
         * its own cached response.
         */

        cache:
          "no-store",

        ...options
      }
    );


  if (!response.ok) {

    throw new Error(
      "API error " +
      response.status
    );

  }


  return response.json();

}


/* ==================================================
   SMALL DELAY HELPER
================================================== */

function wait(
  milliseconds
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        milliseconds
      )
  );

}


/* ==================================================
   BLOCK SIGNATURE
================================================== */

/*
 * We use a small signature to determine
 * whether a block actually changed.
 *
 * This avoids rebuilding the page when
 * Are.na is returning the same data.
 */

function blockSignature(
  block
) {

  return JSON.stringify({

    id:
      block.id,

    type:
      block.type,

    title:
      block.title || "",

    description:
      getBlockDescription(
        block
      ),

    content:
      block.content?.plain ||
      block.content?.markdown ||
      "",

    url:
      block.url ||
      block.source?.url ||
      "",

    created_at:
      block.created_at ||
      "",

    updated_at:
      block.updated_at ||
      "",

    image:
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src ||
      "",

    attachment:
      block.attachment?.url ||
      block.attachment?.file_url ||
      "",

    embed:
      block.embed?.source_url ||
      ""

  });

}


/* ==================================================
   BLOCKS HAVE CHANGED?
================================================== */

function blocksHaveChanged(
  oldBlocks,
  newBlocks
) {

  if (
    oldBlocks.length !==
    newBlocks.length
  ) {

    return true;

  }


  for (
    let i = 0;
    i < newBlocks.length;
    i++
  ) {

    if (
      blockSignature(
        oldBlocks[i]
      )
      !==
      blockSignature(
        newBlocks[i]
      )
    ) {

      return true;

    }

  }


  return false;

}


/* ==================================================
   CHANNEL SIGNATURE
================================================== */

function channelSignature(
  channel
) {

  return JSON.stringify({

    id:
      channel.id,

    title:
      channel.title || "",

    updated_at:
      channel.updated_at || "",

    length:
      channel.length ||
      channel.counts?.blocks ||
      ""

  });

}


/* ==================================================
   LOAD CHANNELS
================================================== */

async function loadChannels() {

  try {

    setStatus(
      "loading…"
    );


    let page = 1;

    let everything = [];


    /*
     * Initial channel discovery is still
     * complete so your navigation remains
     * exactly the same.
     */

    while (true) {

      const result =
        await request(
          `${API}/users/${USER}/contents?page=${page}&per=${PER_PAGE}`
        );


      if (result.data) {

        everything.push(
          ...result.data
        );

      }


      if (
        !result.meta ||
        !result.meta.has_more_pages
      ) {

        break;

      }


      page++;

    }


    channels =
      everything.filter(
        item =>
          item.type ===
          "Channel"
      );


    const ids =
      new Set();


    channels =
      channels.filter(
        channel => {

          if (
            ids.has(
              channel.id
            )
          ) {

            return false;

          }


          ids.add(
            channel.id
          );


          return true;

        }
      );


    channels.sort(
      (a, b) =>
        a.title.localeCompare(
          b.title
        )
    );


    /*
     * Cache channel metadata.
     */

    channels.forEach(
      channel => {

        channelCache.set(
          channel.id,
          channel
        );

      }
    );


    buildNav();


    setStatus("");


    await showAll();


    startAutoRefresh();


  } catch (error) {

    console.error(
      "CHANNEL LIST ERROR:",
      error
    );


    setStatus("");


    showError(
      "Couldn't load your channels."
    );

  }

}


/* ==================================================
   BUILD NAVIGATION
================================================== */

function buildNav() {

  const nav =
    document.getElementById(
      "nav"
    );


  nav.innerHTML =
    "";


  const all =
    document.createElement(
      "button"
    );


  all.textContent =
    "all";


  all.dataset.id =
    "all";


  all.classList.add(
    "active"
  );


  all.onclick =
    showAll;


  nav.appendChild(
    all
  );


  channels.forEach(
    channel => {

      const button =
        document.createElement(
          "button"
        );


      button.textContent =
        channel.title;


      button.dataset.id =
        channel.id;


      button.onclick =
        () =>
          showChannel(
            channel
          );


      nav.appendChild(
        button
      );

    }
  );

}


/* ==================================================
   ACTIVE NAV
================================================== */

function setActive(
  id
) {

  document
    .querySelectorAll(
      "#nav button"
    )
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );


        if (
          String(
            button.dataset.id
          )
          ===
          String(id)
        ) {

          button.classList.add(
            "active"
          );

        }

      }
    );

}


/* ==================================================
   FETCH ONE CHANNEL PAGE
================================================== */

async function fetchChannelPage(
  channel,
  page = 1
) {

  const result =
    await request(
      `${API}/channels/${channel.id}/contents?page=${page}&per=${PER_PAGE}`
    );


  const blocks =
    result.data ||
    [];


  sortChronologically(
    blocks
  );


  return {
    blocks,
    meta:
      result.meta || {}
  };

}


/* ==================================================
   FETCH ALL CHANNEL BLOCKS
================================================== */

async function fetchAllChannelBlocks(
  channel
) {

  let page = 1;

  let blocks = [];


  while (true) {

    const result =
      await fetchChannelPage(
        channel,
        page
      );


    blocks.push(
      ...result.blocks
    );


    if (
      !result.meta ||
      !result.meta.has_more_pages
    ) {

      break;

    }


    page++;

  }


  return blocks;

}


/* ==================================================
   CHRONOLOGICAL SORT
================================================== */

function sortChronologically(
  blocks
) {

  return blocks.sort(
    (a, b) => {

      const dateA =
        new Date(
          a.created_at ||
          0
        ).getTime();


      const dateB =
        new Date(
          b.created_at ||
          0
        ).getTime();


      /*
       * Newest first.
       *
       * Therefore:
       *
       * blocks[0]
       * = newest
       * = top-left
       */

      return dateB -
        dateA;

    }
  );

}


/* ==================================================
   COLUMN COUNT
================================================== */

function getColumnCount() {

  const width =
    window.innerWidth;


  if (
    width <= 550
  ) {

    return 2;

  }


  if (
    width <= 800
  ) {

    return 3;

  }


  return 4;

}


/* ==================================================
   CREATE EMPTY COLUMNS
================================================== */

function createColumns() {

  const grid =
    document.getElementById(
      "grid"
    );


  grid.innerHTML =
    "";


  const count =
    getColumnCount();


  const columns = [];


  for (
    let i = 0;
    i < count;
    i++
  ) {

    const column =
      document.createElement(
        "div"
      );


    column.className =
      "masonry-column";


    grid.appendChild(
      column
    );


    columns.push(
      column
    );

  }


  return columns;

}


/* ==================================================
   RENDER STRICT CHRONOLOGICAL MASONRY
================================================== */

function renderMasonry(
  blocks
) {

  if (!blocks.length) {

    const grid =
      document.getElementById(
        "grid"
      );


    grid.innerHTML =
      `<div class="message">
        This channel is empty.
      </div>`;


    return;

  }


  const columns =
    createColumns();


  /*
   * Strict sequence:
   *
   * 1 → column 1
   * 2 → column 2
   * 3 → column 3
   * 4 → column 4
   * 5 → column 1
   *
   * This preserves your existing
   * top-row chronological layout.
   */

  blocks.forEach(
    (block, index) => {

      const element =
        createBlock(
          block
        );


      if (!element) {
        return;
      }


      const columnIndex =
        index %
        columns.length;


      columns[columnIndex]
        .appendChild(
          element
        );

    }
  );

}


/* ==================================================
   SHOW ALL
================================================== */

async function showAll(
  preserveScroll = false
) {

  const requestId =
    ++viewRequestId;


  currentChannel =
    null;


  currentPage =
    1;


  hasMore =
    false;


  loadedChannelBlocks =
    [];


  setActive(
    "all"
  );


  if (!preserveScroll) {

    reset();

  }


  document.getElementById(
    "title"
  ).textContent =
    "all";


  showLoading();


  try {

    /*
     * IMPORTANT:
     *
     * The initial "all" view still loads
     * all content so the appearance and
     * functionality remain the same.
     */

    const results =
      await Promise.all(

        channels.map(
          async channel => {

            const blocks =
              await fetchAllChannelBlocks(
                channel
              );


            return {
              channel,
              blocks
            };

          }
        )

      );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    let blocks = [];


    results.forEach(
      result => {

        /*
         * Update our channel cache.
         */

        channelCache.set(
          result.channel.id,
          result.channel
        );


        result.blocks.forEach(
          block => {

            if (
              block.type ===
              "Channel"
            ) {

              return;

            }


            blocks.push({

              ...block,

              sourceChannel:
                result.channel.title

            });

          }
        );

      }
    );


    /*
     * Remove duplicates.
     */

    const seen =
      new Set();


    blocks =
      blocks.filter(
        block => {

          if (
            seen.has(
              block.id
            )
          ) {

            return false;

          }


          seen.add(
            block.id
          );


          return true;

        }
      );


    sortChronologically(
      blocks
    );


    /*
     * Save the complete current
     * "all" dataset.
     */

    allBlocksCache =
      blocks;


    clearLoading();


    renderMasonry(
      blocks
    );


    updateLoadMore();


    lastFullSync =
      Date.now();


  } catch (error) {

    console.error(
      "ALL ERROR:",
      error
    );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    showError(
      "Couldn't load your content."
    );

  }

}


/* ==================================================
   ALL VIEW CACHE
================================================== */

let allBlocksCache =
  [];


/* ==================================================
   FAST ALL VIEW REFRESH
================================================== */

/*
 * Instead of downloading every page of
 * every channel every 20 seconds, we first
 * check the first page of every channel.
 *
 * New blocks normally appear there because
 * the API's default ordering is position/date.
 *
 * If something important changes, we rebuild
 * the visible "all" dataset.
 */

async function fastRefreshAll() {

  if (
    autoRefreshing ||
    document.visibilityState !==
    "visible"
  ) {

    return;

  }


  autoRefreshing =
    true;


  try {

    const results =
      await Promise.all(

        channels.map(
          async channel => {

            const result =
              await fetchChannelPage(
                channel,
                1
              );


            return {
              channel,
              blocks:
                result.blocks,
              meta:
                result.meta
            };

          }
        )

      );


    let changed =
      false;


    /*
     * Check the newest page against
     * the cached channel data.
     */

    for (
      const result of results
    ) {

      const old =
        channelFirstPageCache.get(
          result.channel.id
        );


      if (
        !old ||
        blocksHaveChanged(
          old,
          result.blocks
        )
      ) {

        changed =
          true;

      }


      channelFirstPageCache.set(
        result.channel.id,
        result.blocks
      );


      channelCache.set(
        result.channel.id,
        result.channel
      );

    }


    /*
     * If there is no change, do absolutely
     * nothing to the visible page.
     */

    if (!changed) {

      return;

    }


    /*
     * Something changed.
     *
     * Do a full synchronization so
     * additions/removals/edits are all
     * represented correctly.
     */

    await fullRefreshAll(
      true
    );


  } catch (error) {

    console.error(
      "FAST ALL REFRESH ERROR:",
      error
    );

  } finally {

    autoRefreshing =
      false;

  }

}


let channelFirstPageCache =
  new Map();


/* ==================================================
   FULL ALL REFRESH
================================================== */

async function fullRefreshAll(
  preserveScroll = true
) {

  if (
    autoRefreshing &&
    !preserveScroll
  ) {

    return;

  }


  const requestId =
    ++viewRequestId;


  const oldScroll =
    getScrollPosition();


  try {

    const results =
      await Promise.all(

        channels.map(
          async channel => {

            const blocks =
              await fetchAllChannelBlocks(
                channel
              );


            return {
              channel,
              blocks
            };

          }
        )

      );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    let blocks = [];


    results.forEach(
      result => {

        channelCache.set(
          result.channel.id,
          result.channel
        );


        result.blocks.forEach(
          block => {

            if (
              block.type ===
              "Channel"
            ) {

              return;

            }


            blocks.push({

              ...block,

              sourceChannel:
                result.channel.title

            });

          }
        );

      }
    );


    const seen =
      new Set();


    blocks =
      blocks.filter(
        block => {

          if (
            seen.has(
              block.id
            )
          ) {

            return false;

          }


          seen.add(
            block.id
          );


          return true;

        }
      );


    sortChronologically(
      blocks
    );


    allBlocksCache =
      blocks;


    renderMasonry(
      blocks
    );


    lastFullSync =
      Date.now();


    /*
     * Restore exactly where the visitor
     * was before synchronization.
     */

    if (
      preserveScroll
    ) {

      requestAnimationFrame(
        function() {

          window.scrollTo(
            0,
            oldScroll
          );

        }
      );

    }

  } catch (error) {

    console.error(
      "FULL ALL REFRESH ERROR:",
      error
    );

  }

}


/* ==================================================
   SHOW CHANNEL
================================================== */

async function showChannel(
  channel
) {

  const requestId =
    ++viewRequestId;


  currentChannel =
    channel;


  currentPage =
    1;


  hasMore =
    false;


  loadedChannelBlocks =
    [];


  setActive(
    channel.id
  );


  reset();


  document.getElementById(
    "title"
  ).textContent =
    channel.title;


  showLoading();


  try {

    await loadChannelPage(
      channel,
      1,
      true,
      requestId
    );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    window.scrollTo({
      top: 0,
      behavior:
        "smooth"
    });


  } catch (error) {

    console.error(
      "CHANNEL ERROR:",
      error
    );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    showError(
      "Couldn't load this channel."
    );

  }

}


/* ==================================================
   LOAD CHANNEL PAGE
================================================== */

async function loadChannelPage(
  channel,
  page,
  replace,
  requestId
) {

  if (
    loading
  ) {

    return;

  }


  loading =
    true;


  try {

    const result =
      await fetchChannelPage(
        channel,
        page
      );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    const blocks =
      result.blocks;


    if (replace) {

      loadedChannelBlocks =
        [
          ...blocks
        ];


      clearLoading();


      renderMasonry(
        loadedChannelBlocks
      );


    } else {

      /*
       * Keep all previously loaded pages.
       */

      loadedChannelBlocks =
        [
          ...loadedChannelBlocks,
          ...blocks
        ];


      /*
       * Remove accidental duplicates.
       */

      const seen =
        new Set();


      loadedChannelBlocks =
        loadedChannelBlocks.filter(
          block => {

            if (
              seen.has(
                block.id
              )
            ) {

              return false;

            }


            seen.add(
              block.id
            );


            return true;

          }
        );


      sortChronologically(
        loadedChannelBlocks
      );


      renderMasonry(
        loadedChannelBlocks
      );

    }


    /*
     * Cache the first page.
     */

    if (
      page === 1
    ) {

      channelFirstPageCache.set(
        channel.id,
        blocks
      );

    }


    hasMore =
      result.meta?.has_more_pages
      || false;


    currentPage =
      result.meta?.current_page
      || page;


    updateLoadMore();


  } finally {

    loading =
      false;

  }

}


/* ==================================================
   FAST CHANNEL REFRESH
================================================== */

async function refreshCurrentChannel() {

  if (
    !currentChannel ||
    loading ||
    autoRefreshing ||
    document.visibilityState !==
    "visible"
  ) {

    return;

  }


  autoRefreshing =
    true;


  const requestId =
    ++viewRequestId;


  const oldScroll =
    getScrollPosition();


  try {

    /*
     * First check only page 1.
     *
     * This is much faster than downloading
     * every loaded page every 20 seconds.
     */

    const result =
      await fetchChannelPage(
        currentChannel,
        1
      );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    const newFirstPage =
      result.blocks;


    const oldFirstPage =
      channelFirstPageCache.get(
        currentChannel.id
      ) ||
      loadedChannelBlocks.slice(
        0,
        PER_PAGE
      );


    /*
     * If nothing changed, stop here.
     */

    if (
      !blocksHaveChanged(
        oldFirstPage,
        newFirstPage
      )
    ) {

      return;

    }


    channelFirstPageCache.set(
      currentChannel.id,
      newFirstPage
    );


    /*
     * Re-fetch all pages currently
     * needed by the visitor.
     *
     * This catches:
     *
     * - new blocks
     * - deleted blocks
     * - changed descriptions
     * - changed titles
     * - changed images
     * - changed videos
     */

    let freshBlocks =
      [];


    const pagesNeeded =
      Math.max(
        1,
        currentPage
      );


    for (
      let page = 1;
      page <= pagesNeeded;
      page++
    ) {

      const pageResult =
        await fetchChannelPage(
          currentChannel,
          page
        );


      freshBlocks.push(
        ...pageResult.blocks
      );


      if (
        !pageResult.meta?.has_more_pages
      ) {

        break;

      }

    }


    /*
     * Deduplicate.
     */

    const seen =
      new Set();


    freshBlocks =
      freshBlocks.filter(
        block => {

          if (
            seen.has(
              block.id
            )
          ) {

            return false;

          }


          seen.add(
            block.id
          );


          return true;

        }
      );


    sortChronologically(
      freshBlocks
    );


    loadedChannelBlocks =
      freshBlocks;


    hasMore =
      result.meta?.has_more_pages
      || false;


    currentPage =
      Math.min(
        currentPage,
        result.meta?.current_page
        || currentPage
      );


    renderMasonry(
      loadedChannelBlocks
    );


    updateLoadMore();


    /*
     * Put the visitor back at the exact
     * scroll position they were using.
     */

    requestAnimationFrame(
      function() {

        window.scrollTo(
          0,
          oldScroll
        );

      }
    );


  } catch (error) {

    console.error(
      "AUTO CHANNEL REFRESH ERROR:",
      error
    );

  } finally {

    autoRefreshing =
      false;

  }

}


/* ==================================================
   DEEP CHANNEL SYNCHRONIZATION
================================================== */

/*
 * Every FULL_SYNC_INTERVAL we perform
 * a deeper synchronization.
 *
 * This catches edits to older blocks that
 * aren't currently on page 1.
 */

async function deepRefreshCurrentChannel() {

  if (
    !currentChannel ||
    loading ||
    autoRefreshing ||
    document.visibilityState !==
    "visible"
  ) {

    return;

  }


  autoRefreshing =
    true;


  const requestId =
    ++viewRequestId;


  const oldScroll =
    getScrollPosition();


  try {

    const freshBlocks =
      await fetchAllChannelBlocks(
        currentChannel
      );


    if (
      requestId !==
      viewRequestId
    ) {

      return;

    }


    if (
      blocksHaveChanged(
        loadedChannelBlocks,
        freshBlocks
      )
      ||
      freshBlocks.length !==
      loadedChannelBlocks.length
    ) {

      loadedChannelBlocks =
        freshBlocks;


      renderMasonry(
        loadedChannelBlocks
      );


      requestAnimationFrame(
        function() {

          window.scrollTo(
            0,
            oldScroll
          );

        }
      );

    }


    hasMore =
      false;


    updateLoadMore();


    channelFirstPageCache.set(
      currentChannel.id,
      freshBlocks.slice(
        0,
        PER_PAGE
      )
    );


  } catch (error) {

    console.error(
      "DEEP CHANNEL REFRESH ERROR:",
      error
    );

  } finally {

    autoRefreshing =
      false;

  }

}

/* ==================================================
   GET DESCRIPTION
================================================== */

function getBlockDescription(
  block
) {

  if (
    typeof block.description ===
    "string"
  ) {

    return block.description.trim();

  }


  if (
    block.description &&
    typeof block.description.plain ===
    "string"
  ) {

    return block.description.plain.trim();

  }


  if (
    block.description &&
    typeof block.description.text ===
    "string"
  ) {

    return block.description.text.trim();

  }


  return "";

}


/* ==================================================
   CREATE BLOCK
================================================== */

function createBlock(
  block
) {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "block";


  /* ==================================================
     IMAGE
  ================================================== */

  if (
    block.type ===
    "Image"
  ) {

    wrapper.classList.add(
      "image-block"
    );


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (!imageUrl) {

      return null;

    }


    const link =
      document.createElement(
        "a"
      );


    link.href =
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const image =
      document.createElement(
        "img"
      );


    image.src =
      imageUrl;


    image.alt =
      block.title ||
      block.image?.alt_text ||
      "";


    image.loading =
      "lazy";


    image.decoding =
      "async";


    image.onerror =
      function() {

        wrapper.remove();

      };


    link.appendChild(
      image
    );


    wrapper.appendChild(
      link
    );


    const description =
      getBlockDescription(
        block
      );


    if (
      description
    ) {

      const note =
        document.createElement(
          "div"
        );


      note.className =
        "image-note";


      note.textContent =
        description;


      wrapper.appendChild(
        note
      );

    }


    if (block.title) {

      const caption =
        document.createElement(
          "div"
        );


      caption.className =
        "caption";


      caption.textContent =
        block.title;


      wrapper.appendChild(
        caption
      );

    }


    return wrapper;

  }


  /* ==================================================
     TEXT
  ================================================== */

  if (
    block.type ===
    "Text"
  ) {

    const text =
      document.createElement(
        "div"
      );


    text.className =
      "text-block";


    text.textContent =
      block.content?.plain ||
      "";


    wrapper.appendChild(
      text
    );


    return wrapper;

  }


  /* ==================================================
     LINK
  ================================================== */

  if (
    block.type ===
    "Link"
  ) {

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "link-block";


    link.href =
      block.url ||
      block.source?.url ||
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (imageUrl) {

      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageUrl;


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.onerror =
        function() {

          image.style.display =
            "none";

        };


      link.appendChild(
        image
      );

    }


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "link-title";


    title.textContent =
      block.title ||
      block.source?.title ||
      "link";


    link.appendChild(
      title
    );


    const url =
      document.createElement(
        "div"
      );


    url.className =
      "link-url";


    url.textContent =
      block.url ||
      block.source?.url ||
      "";


    link.appendChild(
      url
    );


    wrapper.appendChild(
      link
    );


    return wrapper;

  }


  /* ==================================================
     ATTACHMENT / VIDEO
  ================================================== */

  if (
    block.type ===
    "Attachment"
  ) {

    const attachmentUrl =
      block.attachment?.url ||
      block.attachment?.file_url ||
      block.url ||
      block.original?.url;


    const contentType =
      block.content_type ||
      block.attachment?.content_type ||
      "";


    const isVideo =
      contentType.startsWith(
        "video/"
      ) ||
      (
        attachmentUrl &&
        /\.(mp4|webm|mov|m4v|ogv)(\?.*)?$/i.test(
          attachmentUrl
        )
      );


    /* ==================================================
       VIDEO
    ================================================== */

    if (
      isVideo &&
      attachmentUrl
    ) {

      const link =
        document.createElement(
          "a"
        );


      link.className =
        "video-link";


      link.href =
        `https://www.are.na/block/${block.id}`;


      link.target =
        "_blank";


      link.rel =
        "noopener noreferrer";


      const video =
        document.createElement(
          "video"
        );


      video.src =
        attachmentUrl;


      video.autoplay =
        true;


      video.muted =
        true;


      video.loop =
        true;


      video.playsInline =
        true;


      video.setAttribute(
        "autoplay",
        ""
      );


      video.setAttribute(
        "muted",
        ""
      );


      video.setAttribute(
        "loop",
        ""
      );


      video.setAttribute(
        "playsinline",
        ""
      );


      video.controls =
        false;


      video.addEventListener(
        "canplay",
        function() {

          video.play().catch(
            function() {}
          );

        }
      );


      link.appendChild(
        video
      );


      wrapper.appendChild(
        link
      );


      if (block.title) {

        const caption =
          document.createElement(
            "div"
          );


        caption.className =
          "caption";


        caption.textContent =
          block.title;


        wrapper.appendChild(
          caption
        );

      }


      return wrapper;

    }


    /* ==================================================
       NORMAL ATTACHMENT
    ================================================== */

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "link-block";


    link.href =
      block.url ||
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (imageUrl) {

      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageUrl;


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.onerror =
        function() {

          image.style.display =
            "none";

        };


      link.appendChild(
        image
      );

    }


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "link-title";


    title.textContent =
      block.title ||
      block.filename ||
      "attachment";


    link.appendChild(
      title
    );


    wrapper.appendChild(
      link
    );


    return wrapper;

  }


  /* ==================================================
     EMBED
  ================================================== */

  if (
    block.type ===
    "Embed"
  ) {

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "link-block";


    link.href =
      block.embed?.source_url ||
      block.source?.url ||
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (imageUrl) {

      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageUrl;


      image.loading =
        "lazy";


      image.decoding =
        "async";


      link.appendChild(
        image
      );

    }


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "link-title";


    title.textContent =
      block.title ||
      "embed";


    link.appendChild(
      title
    );


    wrapper.appendChild(
      link
    );


    return wrapper;

  }


  return null;

}

/* ==================================================
   AUTOMATIC REFRESH
================================================== */

function startAutoRefresh() {

  if (refreshTimer) {

    clearInterval(
      refreshTimer
    );

  }


  if (fullSyncTimer) {

    clearInterval(
      fullSyncTimer
    );

  }


  /*
   * FAST CHECK
   *
   * Every 20 seconds.
   */

  refreshTimer =
    setInterval(
      async function() {

        if (
          document.visibilityState !==
          "visible"
        ) {

          return;

        }


        if (
          currentChannel
        ) {

          await refreshCurrentChannel();

        } else {

          await fastRefreshAll();

        }

      },
      REFRESH_INTERVAL
    );


  /*
   * DEEP CHECK
   *
   * Every 2 minutes.
   */

  fullSyncTimer =
    setInterval(
      async function() {

        if (
          document.visibilityState !==
          "visible"
        ) {

          return;

        }


        if (
          Date.now() -
          lastFullSync <
          FULL_SYNC_INTERVAL
        ) {

          return;

        }


        if (
          currentChannel
        ) {

          await deepRefreshCurrentChannel();

        } else {

          await fullRefreshAll(
            true
          );

        }

      },
      FULL_SYNC_INTERVAL
    );

}

    );

    ) {

    } else {

    }

/* ==================================================
   RESPONSIVE REBUILD
================================================== */

let resizeTimer = null;

let previousColumnCount =
  getColumnCount();


window.addEventListener(
  "resize",
  function() {

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        async function() {

          const newColumnCount =
            getColumnCount();


          if (
            newColumnCount ===
            previousColumnCount
          ) {

            return;

          }


          previousColumnCount =
            newColumnCount;


          /*
           * Rebuild the current view using
           * already-loaded data where possible.
           *
           * This avoids making an unnecessary
           * API request just because the
           * browser width changed.
           */

          if (
            currentChannel
          ) {

            if (
              loadedChannelBlocks.length
            ) {

              renderMasonry(
                loadedChannelBlocks
              );

            } else {

              await refreshCurrentChannel();

            }

          } else {

            if (
              allBlocksCache.length
            ) {

              renderMasonry(
                allBlocksCache
              );

            } else {

              await fullRefreshAll(
                true
              );

            }

          }

        },
        200
      );

  }
);


/* ==================================================
   START
================================================== */

loadChannels();

</script>
