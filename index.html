<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>emy</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;
      line-height: 1.35;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ==================================================
       HEADER
    ================================================== */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(
        255,
        255,
        255,
        0.96
      );

      border-bottom:
        1px solid #ddd;
    }

    .top {
      display: none;
    }

    .status {
      color: #999;
      font-size: 11px;
    }


    /* ==================================================
       CHANNEL NAVIGATION
    ================================================== */

    nav {
      display: flex;

      gap: 16px;

      padding:
        12px 16px;

      /*
       * Keep all channels on ONE line.
       */

      flex-wrap: nowrap;

      white-space: nowrap;

      /*
       * Allow horizontal scrolling when
       * there are more channels than fit.
       */

      overflow-x: auto;
      overflow-y: hidden;

      /*
       * Smooth touch scrolling on phones.
       */

      -webkit-overflow-scrolling:
        touch;

      /*
       * Hide scrollbar.
       */

      scrollbar-width: none;
    }

    nav::-webkit-scrollbar {
      display: none;
    }

    nav button {

      /*
       * Prevent individual buttons
       * from shrinking.
       */

      flex: 0 0 auto;

      border: 0;

      padding: 0;
      margin: 0;

      background: transparent;
      color: #999;

      font-family: inherit;
      font-size: 13px;

      white-space: nowrap;

      cursor: pointer;
    }

    nav button:hover,
    nav button.active {
      color: #111;
    }


    /* ==================================================
       MAIN
    ================================================== */

    main {
      padding:
        18px 16px 60px;
    }

    .channel-title {
      margin:
        0 0 20px;

      font-size: 13px;
      font-weight: normal;
    }


    /* ==================================================
       GRID
    ================================================== */

    .grid {
      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0, 1fr)
        );

      gap:
        20px 16px;

      align-items: start;
    }


    /* ==================================================
       BLOCK
    ================================================== */

    .block {
      min-width: 0;
    }

    .block img {
      display: block;

      width: 100%;
      height: auto;

      background: #f5f5f5;
    }


    /* ==================================================
       VIDEO
    ================================================== */

    .video-link {
      display: block;
      cursor: pointer;
    }

    .block video {
      display: block;

      width: 100%;
      height: auto;

      background: #f5f5f5;

      object-fit: contain;

      pointer-events: none;
    }


    /* ==================================================
       CAPTION
    ================================================== */

    .caption {
      margin-top: 6px;

      color: #777;
      font-size: 11px;
    }


    /* ==================================================
       TEXT
    ================================================== */

    .text-block {
      padding: 12px;

      background: #f4f4f4;

      white-space: pre-wrap;
    }


    /* ==================================================
       LINKS
    ================================================== */

    .link-block {
      display: block;

      border-top:
        1px solid #ccc;

      padding-top: 7px;
    }

    .link-block img {
      margin-bottom: 7px;
    }

    .link-title {
      font-size: 13px;
    }

    .link-url {
      margin-top: 3px;

      color: #999;
      font-size: 11px;

      word-break: break-word;
    }


    /* ==================================================
       MESSAGES
    ================================================== */

    .message {
      padding: 40px 0;
      color: #999;
    }


    /* ==================================================
       LOAD MORE
    ================================================== */

    .load-more {
      display: block;

      margin:
        45px auto 0;

      border: 0;

      background: transparent;
      color: #888;

      font-family: inherit;
      font-size: 12px;

      cursor: pointer;
    }

    .load-more:hover {
      color: #111;
    }


    /* ==================================================
       SCROLL TO TOP BUTTON
    ================================================== */

    #scrollTop {

      position: fixed;

      left: 50%;

      bottom: 15px;

      transform:
        translateX(-50%);

      z-index: 999999;

      /*
       * Hidden until the user scrolls
       * approximately 60px.
       */

      display: none;

      border: 0;

      padding:
        5px 8px;

      margin: 0;

      background:
        rgba(
          255,
          255,
          255,
          0.95
        );

      color: #888;

      font-family: inherit;
      font-size: 11px;

      line-height: 1;

      cursor: pointer;
    }

    #scrollTop:hover {
      color: #111;
    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (
      max-width: 800px
    ) {

      .grid {
        grid-template-columns:
          repeat(
            3,
            minmax(0, 1fr)
          );
      }

    }


    @media (
      max-width: 550px
    ) {

      body {
        font-size: 12px;
      }

      .top {
        padding:
          10px 12px 7px;
      }

      nav {

        padding-left: 12px;
        padding-right: 12px;

        padding-bottom: 10px;

        gap: 13px;

        /*
         * Still one line on mobile.
         */

        flex-wrap: nowrap;

        overflow-x: auto;

      }

      nav button {
        font-size: 12px;
      }

      main {
        padding:
          14px 12px 50px;
      }

      .grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );

        gap:
          16px 10px;
      }

      #scrollTop {
        bottom: 12px;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="top">

    <div
      class="status"
      id="status"
    ></div>

  </div>


  <nav id="nav"></nav>

</header>


<main>

  <h1
    class="channel-title"
    id="title"
  >
    all
  </h1>


  <div
    class="grid"
    id="grid"
  >

    <div class="message">
      loading…
    </div>

  </div>


  <button
    class="load-more"
    id="loadMore"
    style="display:none"
  >
    load more
  </button>

</main>


<!-- ==================================================
     SCROLL TO TOP BUTTON
================================================== -->

<button
  id="scrollTop"
  type="button"
  aria-label="Scroll to top"
>
  ↑ top
</button>


<script>

/* ==================================================
   SETTINGS
================================================== */

const USER =
  "emy-fuplg6fvywk";

const API =
  "https://api.are.na/v3";

const PER_PAGE =
  100;

const REFRESH_INTERVAL =
  5 * 60 * 1000;


/*
 * The scroll-to-top button appears
 * after approximately 60px.
 */

const SCROLL_THRESHOLD =
  60;


/* ==================================================
   STATE
================================================== */

let channels = [];

let currentChannel = null;

let currentPage = 1;

let hasMore = false;

let loading = false;

let refreshTimer = null;

let viewRequestId = 0;


/* ==================================================
   API REQUEST
================================================== */

async function request(url) {

  const response =
    await fetch(url, {
      cache: "no-cache"
    });

  if (!response.ok) {

    throw new Error(
      "API error " +
      response.status
    );

  }

  return response.json();

}


/* ==================================================
   LOAD YOUR CREATED CHANNELS
================================================== */

async function loadChannels() {

  try {

    setStatus("loading…");

    let page = 1;

    let everything = [];


    while (true) {

      const result =
        await request(
          `${API}/users/${USER}/contents?page=${page}&per=${PER_PAGE}`
        );


      if (result.data) {

        everything.push(
          ...result.data
        );

      }


      if (
        !result.meta ||
        !result.meta.has_more_pages
      ) {

        break;

      }


      page++;

    }


    channels =
      everything.filter(
        item =>
          item.type === "Channel"
      );


    const ids =
      new Set();


    channels =
      channels.filter(
        channel => {

          if (
            ids.has(channel.id)
          ) {

            return false;

          }


          ids.add(
            channel.id
          );


          return true;

        }
      );


    channels.sort(
      (a, b) =>
        a.title.localeCompare(
          b.title
        )
    );


    buildNav();

    setStatus("");

    await showAll();

    startAutoRefresh();


  } catch (error) {

    console.error(
      "CHANNEL LIST ERROR:",
      error
    );

    setStatus("");

    showError(
      "Couldn't load your channels."
    );

  }

}


/* ==================================================
   BUILD NAVIGATION
================================================== */

function buildNav() {

  const nav =
    document.getElementById(
      "nav"
    );


  nav.innerHTML = "";


  const all =
    document.createElement(
      "button"
    );


  all.textContent =
    "all";


  all.dataset.id =
    "all";


  all.classList.add(
    "active"
  );


  all.onclick =
    showAll;


  nav.appendChild(
    all
  );


  channels.forEach(
    channel => {

      const button =
        document.createElement(
          "button"
        );


      button.textContent =
        channel.title;


      button.dataset.id =
        channel.id;


      button.onclick =
        () =>
          showChannel(
            channel
          );


      nav.appendChild(
        button
      );

    }
  );

}


/* ==================================================
   ACTIVE NAVIGATION
================================================== */

function setActive(id) {

  document
    .querySelectorAll(
      "#nav button"
    )
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );


        if (
          String(
            button.dataset.id
          )
          ===
          String(id)
        ) {

          button.classList.add(
            "active"
          );

        }

      }
    );

}


/* ==================================================
   FETCH ONE CHANNEL — ALL PAGES
================================================== */

async function fetchAllChannelBlocks(
  channel
) {

  let page = 1;

  let blocks = [];


  while (true) {

    const result =
      await request(
        `${API}/channels/${channel.id}/contents?page=${page}&per=${PER_PAGE}`
      );


    if (result.data) {

      blocks.push(
        ...result.data
      );

    }


    if (
      !result.meta ||
      !result.meta.has_more_pages
    ) {

      break;

    }


    page++;

  }


  return blocks;

}


/* ==================================================
   SHOW ALL
================================================== */

async function showAll(
  preserveScroll = false
) {

  const requestId =
    ++viewRequestId;


  currentChannel =
    null;


  currentPage =
    1;


  hasMore =
    false;


  setActive("all");


  if (!preserveScroll) {

    reset();

  }


  document.getElementById(
    "title"
  ).textContent =
    "all";


  showLoading();


  try {

    const results =
      await Promise.all(

        channels.map(
          async channel => {

            const blocks =
              await fetchAllChannelBlocks(
                channel
              );


            return {
              channel,
              blocks
            };

          }
        )

      );


    if (
      requestId !== viewRequestId
    ) {

      return;

    }


    let blocks = [];


    results.forEach(
      result => {

        result.blocks.forEach(
          block => {

            if (
              block.type === "Channel"
            ) {

              return;

            }


            blocks.push({

              ...block,

              sourceChannel:
                result.channel.title

            });

          }
        );

      }
    );


    const seen =
      new Set();


    blocks =
      blocks.filter(
        block => {

          if (
            seen.has(block.id)
          ) {

            return false;

          }


          seen.add(
            block.id
          );


          return true;

        }
      );


    blocks.sort(
      (a, b) => {

        const dateA =
          new Date(
            a.created_at || 0
          ).getTime();


        const dateB =
          new Date(
            b.created_at || 0
          ).getTime();


        return dateB - dateA;

      }
    );


    clearLoading();


    render(
      blocks,
      true
    );


    updateLoadMore();


  } catch (error) {

    console.error(
      "ALL ERROR:",
      error
    );


    if (
      requestId !== viewRequestId
    ) {

      return;

    }


    showError(
      "Couldn't load your content."
    );

  }

}


/* ==================================================
   SHOW CHANNEL
================================================== */

async function showChannel(
  channel
) {

  const requestId =
    ++viewRequestId;


  currentChannel =
    channel;


  currentPage =
    1;


  hasMore =
    false;


  setActive(
    channel.id
  );


  reset();


  document.getElementById(
    "title"
  ).textContent =
    channel.title;


  showLoading();


  try {

    await loadChannelPage(
      channel,
      1,
      true,
      requestId
    );


    if (
      requestId !== viewRequestId
    ) {

      return;

    }


    window.scrollTo(
      {
        top: 0,
        behavior: "smooth"
      }
    );


  } catch (error) {

    console.error(
      "CHANNEL ERROR:",
      error
    );


    if (
      requestId !== viewRequestId
    ) {

      return;

    }


    showError(
      "Couldn't load this channel."
    );

  }

}


/* ==================================================
   LOAD CHANNEL CONTENT
================================================== */

async function loadChannelPage(
  channel,
  page,
  replace,
  requestId
) {

  if (loading) {

    return;

  }


  loading =
    true;


  try {

    const url =
      `${API}/channels/${channel.id}/contents?page=${page}&per=${PER_PAGE}`;


    console.log(
      "Loading:",
      url
    );


    const result =
      await request(url);


    if (
      requestId !== viewRequestId
    ) {

      return;

    }


    const blocks =
      result.data || [];


    if (replace) {

      clearLoading();

    }


    render(
      blocks,
      replace
    );


    hasMore =
      result.meta?.has_more_pages
      || false;


    currentPage =
      result.meta?.current_page
      || page;


    updateLoadMore();


  } finally {

    loading =
      false;

  }

}


/* ==================================================
   LOAD MORE
================================================== */

document
  .getElementById(
    "loadMore"
  )
  .onclick =
  async function() {

    if (
      !currentChannel ||
      !hasMore ||
      loading
    ) {

      return;

    }


    this.textContent =
      "loading…";


    await loadChannelPage(
      currentChannel,
      currentPage + 1,
      false,
      viewRequestId
    );


    this.textContent =
      "load more";

  };


/* ==================================================
   RENDER
================================================== */

function render(
  blocks,
  replace = false
) {

  const grid =
    document.getElementById(
      "grid"
    );


  if (replace) {

    grid.innerHTML =
      "";

  }


  blocks.forEach(
    block => {

      const element =
        createBlock(
          block
        );


      if (element) {

        grid.appendChild(
          element
        );

      }

    }
  );


  if (
    replace &&
    !blocks.length
  ) {

    grid.innerHTML =
      `<div class="message">
        This channel is empty.
      </div>`;

  }

}


/* ==================================================
   CREATE BLOCK
================================================== */

function createBlock(
  block
) {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "block";


  /* -----------------------------------------------
     IMAGE
  ------------------------------------------------ */

  if (
    block.type ===
    "Image"
  ) {

    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (!imageUrl) {

      return null;

    }


    const link =
      document.createElement(
        "a"
      );


    link.href =
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const image =
      document.createElement(
        "img"
      );


    image.src =
      imageUrl;


    image.alt =
      block.title ||
      block.image?.alt_text ||
      "";


    image.loading =
      "lazy";


    image.decoding =
      "async";


    image.onerror =
      function() {

        wrapper.remove();

      };


    link.appendChild(
      image
    );


    wrapper.appendChild(
      link
    );


    if (block.title) {

      const caption =
        document.createElement(
          "div"
        );


      caption.className =
        "caption";


      caption.textContent =
        block.title;


      wrapper.appendChild(
        caption
      );

    }


    return wrapper;

  }


  /* -----------------------------------------------
     TEXT
  ------------------------------------------------ */

  if (
    block.type ===
    "Text"
  ) {

    const text =
      document.createElement(
        "div"
      );


    text.className =
      "text-block";


    text.textContent =
      block.content?.plain ||
      "";


    wrapper.appendChild(
      text
    );


    return wrapper;

  }


  /* -----------------------------------------------
     LINK
  ------------------------------------------------ */

  if (
    block.type ===
    "Link"
  ) {

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "link-block";


    link.href =
      block.url ||
      block.source?.url ||
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (imageUrl) {

      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageUrl;


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.onerror =
        function() {

          image.style.display =
            "none";

        };


      link.appendChild(
        image
      );

    }


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "link-title";


    title.textContent =
      block.title ||
      block.source?.title ||
      "link";


    link.appendChild(
      title
    );


    const url =
      document.createElement(
        "div"
      );


    url.className =
      "link-url";


    url.textContent =
      block.url ||
      block.source?.url ||
      "";


    link.appendChild(
      url
    );


    wrapper.appendChild(
      link
    );


    return wrapper;

  }


  /* -----------------------------------------------
     ATTACHMENT / VIDEO
  ------------------------------------------------ */

  if (
    block.type ===
    "Attachment"
  ) {

    const attachmentUrl =
      block.attachment?.url ||
      block.attachment?.file_url ||
      block.url ||
      block.original?.url;


    const contentType =
      block.content_type ||
      block.attachment?.content_type ||
      "";


    const isVideo =
      contentType.startsWith("video/") ||
      (
        attachmentUrl &&
        /\.(mp4|webm|mov|m4v|ogv)(\?.*)?$/i.test(
          attachmentUrl
        )
      );


    /* -----------------------------------------------
       VIDEO
    ------------------------------------------------ */

    if (
      isVideo &&
      attachmentUrl
    ) {

      const link =
        document.createElement(
          "a"
        );


      link.className =
        "video-link";


      link.href =
        `https://www.are.na/block/${block.id}`;


      link.target =
        "_blank";


      link.rel =
        "noopener noreferrer";


      const video =
        document.createElement(
          "video"
        );


      video.src =
        attachmentUrl;


      video.autoplay =
        true;


      video.muted =
        true;


      video.loop =
        true;


      video.playsInline =
        true;


      video.setAttribute(
        "autoplay",
        ""
      );


      video.setAttribute(
        "muted",
        ""
      );


      video.setAttribute(
        "loop",
        ""
      );


      video.setAttribute(
        "playsinline",
        ""
      );


      video.controls =
        false;


      video.addEventListener(
        "canplay",
        function() {

          video.play().catch(
            function() {}
          );

        }
      );


      link.appendChild(
        video
      );


      wrapper.appendChild(
        link
      );


      if (block.title) {

        const caption =
          document.createElement(
            "div"
          );


        caption.className =
          "caption";


        caption.textContent =
          block.title;


        wrapper.appendChild(
          caption
        );

      }


      return wrapper;

    }


    /* -----------------------------------------------
       NORMAL ATTACHMENT
    ------------------------------------------------ */

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "link-block";


    link.href =
      block.url ||
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (imageUrl) {

      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageUrl;


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.onerror =
        function() {

          image.style.display =
            "none";

        };


      link.appendChild(
        image
      );

    }


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "link-title";


    title.textContent =
      block.title ||
      block.filename ||
      "attachment";


    link.appendChild(
      title
    );


    wrapper.appendChild(
      link
    );


    return wrapper;

  }


  /* -----------------------------------------------
     EMBED
    ----------------------------------------------- */

  if (
    block.type ===
    "Embed"
  ) {

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "link-block";


    link.href =
      block.embed?.source_url ||
      block.source?.url ||
      `https://www.are.na/block/${block.id}`;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    const imageUrl =
      block.image?.large?.src ||
      block.image?.medium?.src ||
      block.image?.small?.src ||
      block.image?.src;


    if (imageUrl) {

      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageUrl;


      image.loading =
        "lazy";


      image.decoding =
        "async";


      link.appendChild(
        image
      );

    }


    const title =
      document.createElement(
        "div"
      );


    title.className =
      "link-title";


    title.textContent =
      block.title ||
      "embed";


    link.appendChild(
      title
    );


    wrapper.appendChild(
      link
    );


    return wrapper;

  }


  return null;

}


/* ==================================================
   RESET
================================================== */

function reset() {

  document.getElementById(
    "grid"
  ).innerHTML =
    "";


  document.getElementById(
    "loadMore"
  ).style.display =
    "none";


  currentPage =
    1;


  hasMore =
    false;

}


/* ==================================================
   LOADING
================================================== */

function showLoading() {

  document.getElementById(
    "grid"
  ).innerHTML =
    `<div class="message">
      loading…
    </div>`;

}


function clearLoading() {

  const messages =
    document.querySelectorAll(
      ".message"
    );


  messages.forEach(
    message => {

      message.remove();

    }
  );

}


/* ==================================================
   ERROR
================================================== */

function showError(
  message
) {

  document.getElementById(
    "grid"
  ).innerHTML =
    `<div class="message">
      ${message}
    </div>`;

}


/* ==================================================
   LOAD MORE UI
================================================== */

function updateLoadMore() {

  const button =
    document.getElementById(
      "loadMore"
    );


  if (
    currentChannel &&
    hasMore
  ) {

    button.style.display =
      "block";

  }

  else {

    button.style.display =
      "none";

  }

}


/* ==================================================
   STATUS
================================================== */

function setStatus(
  text
) {

  document.getElementById(
    "status"
  ).textContent =
    text;

}


/* ==================================================
   AUTOMATIC REFRESH
================================================== */

function startAutoRefresh() {

  if (refreshTimer) {

    clearInterval(
      refreshTimer
    );

  }


  refreshTimer =
    setInterval(
      async function() {

        if (
          document.visibilityState !==
          "visible"
        ) {

          return;

        }


        console.log(
          "Automatic Are.na refresh…"
        );


        if (
          currentChannel
        ) {

          await refreshCurrentChannel();

        }

        else {

          await showAll(true);

        }

      },
      REFRESH_INTERVAL
    );

}


/* ==================================================
   REFRESH CURRENT CHANNEL
================================================== */

async function refreshCurrentChannel() {

  if (
    !currentChannel ||
    loading
  ) {

    return;

  }


  const requestId =
    ++viewRequestId;


  try {

    const result =
      await request(
        `${API}/channels/${currentChannel.id}/contents?page=1&per=${PER_PAGE}`
      );


    if (
      requestId !== viewRequestId
    ) {

      return;

    }


    const blocks =
      result.data || [];


    const grid =
      document.getElementById(
        "grid"
      );


    grid.innerHTML =
      "";


    render(
      blocks,
      true
    );


    hasMore =
      result.meta?.has_more_pages
      || false;


    currentPage =
      result.meta?.current_page
      || 1;


    updateLoadMore();


  } catch (error) {

    console.error(
      "AUTO REFRESH ERROR:",
      error
    );

  }

}


/* ==================================================
   SCROLL TO TOP BUTTON
================================================== */

const scrollTopButton =
  document.getElementById(
    "scrollTop"
  );


/*
 * Determine the current scroll position
 * of THIS iframe/page.
 */

function getScrollPosition() {

  return Math.max(
    window.scrollY || 0,

    window.pageYOffset || 0,

    document.documentElement.scrollTop || 0,

    document.body.scrollTop || 0
  );

}


/*
 * Show the button after 60px.
 *
 * We deliberately use a very small
 * interval instead of changing any of
 * the content/loading logic.
 */

function checkScrollPosition() {

  const scrollPosition =
    getScrollPosition();


  if (
    scrollPosition >=
    SCROLL_THRESHOLD
  ) {

    scrollTopButton.style.display =
      "block";

  }

  else {

    scrollTopButton.style.display =
      "none";

  }

}


/*
 * Normal scroll listener.
 */

window.addEventListener(
  "scroll",
  checkScrollPosition,
  {
    passive: true
  }
);


/*
 * Some embedded browsers don't reliably
 * fire scroll events, so check periodically.
 */

setInterval(
  checkScrollPosition,
  100
);


/*
 * Initial state.
 */

checkScrollPosition();


/* ==================================================
   SCROLL TO TOP CLICK
================================================== */

scrollTopButton.addEventListener(
  "click",
  function() {

    /*
     * First scroll THIS iframe
     * completely to the top.
     */

    window.scrollTo({
      top: 0,
      left: 0,
      behavior: "smooth"
    });


    document.documentElement.scrollTop =
      0;


    document.body.scrollTop =
      0;


    /*
     * Also ask the parent Readymag page
     * to scroll to its own top.
     *
     * This does nothing harmful if
     * Readymag does not listen for it.
     */

    try {

      window.parent.postMessage(
        {
          type:
            "ARENA_SCROLL_PARENT_TO_TOP"
        },
        "*"
      );

    }

    catch (error) {

      console.warn(
        "Could not contact parent page."
      );

    }


    /*
     * Hide the button immediately.
     */

    scrollTopButton.style.display =
      "none";

  }
);


/* ==================================================
   START
================================================== */

loadChannels();

</script>
